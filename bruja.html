      function esLocal(h) {

            '</body></html>'

      var host = (location.hostname || "").toLowerCase();

        romper();

      document.addEventListener("dragstart", function (e) { e.preventDefault(); });
      document.addEventListener("selectstart", function (e) { e.preventDefault(); });
      document.addEventListener("cut", function (e) { e.preventDefault(); });

      document.addEventListener("copy", function (e) {
        e.preventDefault();
        if (e.clipboardData) {
          e.clipboardData.setData(
            "text/plain",
            "✨ Dedicatorias Mágicas ✨ https://c4rlo53305-lgtm.github.io/Peri/"

      document.addEventListener("keydown", function (e) {
        var k = (e.key || "").toLowerCase();
        if (k === "f12") { e.preventDefault(); return false; }
        if (e.ctrlKey && e.shiftKey && "ijcke".indexOf(k) !== -1) { e.preventDefault(); return false; }

        if (e.ctrlKey && (k === "u" || k === "s" || k === "p")) { e.preventDefault(); return false; }
      }, true);

      /* CAPA 3 · DETECTOR DE DEVTOOLS */
      var UMBRAL_ANCHO = 180, UMBRAL_ALTO = 320;
      function vigilarDevTools() {
        var dw = window.outerWidth - window.innerWidth;
        var dh = window.outerHeight - window.innerHeight;
        if (dw > UMBRAL_ANCHO || dh > UMBRAL_ALTO) {
          document.documentElement.classList.add("modo-espia");
        } else {
          document.documentElement.classList.remove("modo-espia");
        }
      }
      var esTactil = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      if (!esTactil) { setInterval(vigilarDevTools, 1200); }

        );

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Acme&display=swap");
    :root { font-family: "Acme", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }

    body {
      background-image: radial-gradient(#e88420, #740b85);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1rem 8rem;
      gap: 2rem;
    }

    /* ============================================================
       🎃 FONDO DE CALABACITAS ESTÁTICAS CON DESTELLOS
       ============================================================ */
    .fondo-calabazas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .bg-pumpkin {
      position: absolute;
      background: radial-gradient(circle at 35% 30%,
                  rgba(255, 210, 138, 0.85) 0%,
                  rgba(255, 155, 47, 0.7) 35%,
                  rgba(217, 109, 22, 0.55) 65%,
                  rgba(160, 74, 5, 0.4) 100%);
      border-radius: 50%;
      opacity: 0.22;
      filter: blur(0.5px) drop-shadow(0 0 12px rgba(255, 179, 71, 0.6));
      animation: bg-pumpkin-breathe 5s ease-in-out infinite;
    }

    .bg-pumpkin::before {
      content: "";
      position: absolute;
      top: -22%;
      left: 50%;
      transform: translateX(-50%);
      width: 16%;
      height: 26%;
      background: linear-gradient(180deg,
                  rgba(77, 138, 21, 0.7),
                  rgba(43, 74, 8, 0.5));
      border-radius: 3px 3px 0 0;
    }

    .bg-pumpkin::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 42%, rgba(31, 31, 31, 0.85) 11%, transparent 13%),
        radial-gradient(circle at 68% 42%, rgba(31, 31, 31, 0.85) 11%, transparent 13%),
        radial-gradient(ellipse 22% 13% at 50% 70%, rgba(31, 31, 31, 0.85) 90%, transparent 92%);
    }

    /* ✨ Partícula brillante sobre cada calabaza */
    .bg-sparkle {
      position: absolute;
      width: 5px;
      height: 5px;
      background: radial-gradient(circle, #fff 0%, #ffd166 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
        0 0 6px #fff,
        0 0 12px #ffd166,
        0 0 20px #ff8c00;
      animation: sparkle-twinkle 2.2s ease-in-out infinite;
    }

    @keyframes bg-pumpkin-breathe {
      0%, 100% {
        opacity: 0.18;
        filter: blur(0.5px) drop-shadow(0 0 10px rgba(255, 179, 71, 0.5));
      }
      50% {
        opacity: 0.32;
        filter: blur(0.5px) drop-shadow(0 0 22px rgba(255, 200, 100, 0.9));
      }
    }

    @keyframes sparkle-twinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.5);
      }
      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    /* ============================================================
       AVISO ANTI-INSPECCIÓN
       ============================================================ */
    #avisoEspia {
      display: none;
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      background: #ff3b3b;
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      z-index: 10000;
      text-align: center;
      line-height: 1.3;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }
    #avisoEspia small { opacity: 0.85; font-size: 0.7rem; }
    html.modo-espia #avisoEspia { display: block; }

    /* ============================================================
       BARRA SUPERIOR
       ============================================================ */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.9rem 1rem;
      text-align: center;
      z-index: 200;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.55), transparent);
      pointer-events: none;
    }
    .marca {
      pointer-events: auto;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      padding: 0.55rem 1.15rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: inline-block;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      transition: transform 200ms ease, background 200ms ease;
    }
    .marca:hover {
      background: rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    /* ============================================================
       BOTONES INFERIORES CON LUZ BRILLANTE EN EL CONTORNO
       ============================================================ */
    .acciones {
      position: fixed;
      bottom: 1.1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.75rem;
      z-index: 200;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0 1rem;
      width: 100%;
      max-width: 560px;
    }

    .btn {
      position: relative;
      flex: 1 1 200px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.98rem;
      padding: 0.85rem 1.2rem;
      border-radius: 0.9rem;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      overflow: hidden;
      isolation: isolate;
      transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
      white-space: nowrap;
    }

    /* ✨ Pseudo-elemento con gradiente de luz que recorre el contorno */
    .btn::before {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: inherit;
      padding: 2px;
      background: conic-gradient(
        from var(--angle, 0deg),
        transparent 0deg,
        transparent 60deg,
        rgba(255, 255, 255, 0.95) 90deg,
        #ffffff 100deg,
        rgba(255, 255, 255, 0.95) 110deg,
        transparent 140deg,
        transparent 360deg
      );
      -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
              mask-composite: exclude;
      pointer-events: none;
      animation: btn-light-sweep 2.6s linear infinite;
      z-index: 2;
    }

    /* Capa interior del botón para que el contenido esté encima */
    .btn > * { position: relative; z-index: 3; }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    @keyframes btn-light-sweep {
      to { --angle: 360deg; }
    }

    /* Fallback para navegadores sin @property: usamos brillo alternativo */
    @supports not (background: conic-gradient(from var(--angle, 0deg), red, blue)) {
      .btn::before {
        background: linear-gradient(120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.9) 50%,
          transparent 70%);
        animation: btn-light-slide 2.6s linear infinite;
      }
      @keyframes btn-light-slide {
        0%   { transform: translateX(-120%); }
        100% { transform: translateX(120%); }
      }
    }

    .btn-wa {
      background: #25d366;
      box-shadow: 0 0.35rem #128c4a,
                  0 0 12px rgba(37, 211, 102, 0.55);
    }
    .btn-wa:hover {
      filter: brightness(1.08);
      box-shadow: 0 0.35rem #128c4a,
                  0 0 22px rgba(37, 211, 102, 0.9);
    }
    .btn-wa:active { transform: translateY(0.35rem); box-shadow: 0 0 #128c4a; }

    .btn-personalizar {
      background: #8d65c9;
      box-shadow: 0 0.35rem #5b3d92,
                  0 0 12px rgba(141, 101, 201, 0.6);
    }
    .btn-personalizar:hover {
      filter: brightness(1.08);
      box-shadow: 0 0.35rem #5b3d92,
                  0 0 22px rgba(180, 140, 255, 0.95);
    }
    .btn-personalizar:active { transform: translateY(0.35rem); box-shadow: 0 0 #5b3d92; }

    /* ============================================================
       ESCENARIO
       ============================================================ */
    div { box-sizing: border-box; }
    #TrickOrTreat { margin: auto; position: relative; z-index: 5; }
    .container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      overflow: visible;
    }

    /* ---------------- CABEZA ---------------- */
    .head { width: 4.2rem; height: 4rem; position: relative; }
    .face {
      background-color: #f7d199;
      width: 100%; height: 100%;
      overflow: hidden;
      position: relative;
      transform-style: preserve-3d;
      perspective: 1000px;
      border-radius: 99999px;
    }
    .face * { transform-style: preserve-3d; }
    .face-container {
      width: 100%; height: 100%;
      transform-origin: center center 2rem;
      transform: translateZ(2rem);
    }
    .eye {
      background-color: #000000;
      width: 0.4rem; height: 0.4rem;
      position: absolute;
      top: 2.2rem;
      border-radius: 99999px;
      transition: all 400ms ease;
    }
    .eye.left { left: 1rem; }
    .eye.right { right: 1rem; }
    .eye::after {
      content: "";
      background-color: #ffffff;
      width: 0.09rem; height: 0.09rem;
      position: absolute;
      top: 0.09rem; left: 0.09rem;
      border-radius: 99999px;
    }
    .blush {
      background-color: #f79999;
      width: 1.2rem; height: 1.2rem;
      position: absolute;
      top: 2.7rem;
      border-radius: 99999px;
      filter: blur(4px);
    }
    .blush.left { left: 0.3rem; }
    .blush.right { right: 0.3rem; }
    .mouth {
      width: 0.9rem; height: 0.4rem;
      border: solid 0.125rem #000000;
      border-top: 0;
      position: absolute;
      top: 2.95rem;
      left: calc(50% - 0.45rem);
      border-radius: 0 0 99999px 99999px;
      transition: all 400ms ease;
    }
    .hair {
      background-color: #000000;
      width: 4.6rem; height: 2.7rem;
      position: absolute;
      top: -0.9rem;
      left: calc(50% - 2.3rem);
      border-radius: 99999px 99999px 0 0;
    }
    .hair-1 {
      background-color: #000000;
      width: 2.5rem; height: 2.5rem;
      position: absolute;
      top: 1.2rem;
    }
    .hair-1.left {
      left: -1.75rem;
      border-radius: 50% 50% 50% 0;
      transform: skew(-15deg) rotate(-25deg);
    }
    .hair-1.right {
      right: -1.75rem;
      border-radius: 50% 50% 0 50%;
      transform: skew(15deg) rotate(25deg);
    }

    /* ---------------- SOMBRERO (SIN BRILLO) ---------------- */
    .hat { position: absolute; top: 0; left: 50%; }
    .hat .hat-top {
      background-image: linear-gradient(45deg, transparent 0% 50%, #8d65c9 50% 100%);
      width: 3.8rem; height: 3.8rem;
      overflow: hidden;
      position: absolute;
      top: -1.75rem;
      left: calc(50% - 1.9rem);
      transform: rotate(-55deg) skew(-20deg);
    }
    .hat .hat-top .hat-ribbon {
      background-color: #d14949;
      width: 5rem; height: 0.75rem;
      position: absolute;
      top: calc(calc(50% - 0.375rem) - 0.5rem);
      left: calc(calc(50% - 2.5rem) + 0.5rem);
      border-radius: 50% 50% 0% 0%/100% 100% 0% 0%;
      transform: rotate(43.75deg);
    }
    .hat .hat-bottom {
      background-color: #8d65c9;
      width: 6.75rem; height: 1.75rem;
      position: absolute;
      top: -0.5rem;
      left: calc(50% - 3.375rem);
      border-radius: 50% 50% 25% 25%/75% 75% 25% 25%;
    }
    .hat .hat-bottom::after {
      content: "";
      background-color: #000000;
      width: 4.8rem; height: 1.15rem;
      position: absolute;
      bottom: 0;
      left: calc(50% - 2.4rem);
      border-radius: 50% 50% 0% 0%/100% 100% 0% 0%;
    }

    /* ---------------- CUERPO ---------------- */
    .body-1 {
      width: 0; height: 0;
      position: absolute;
      top: 0; left: 50%;
      transform-origin: bottom center;
    }
    .witch-skirt {
      width: 0; height: 5rem;
      border-left: solid 2.25rem transparent;
      border-right: solid 2.25rem transparent;
      border-top: 0;
      border-bottom: solid 5rem #8d65c9;
      position: absolute;
      top: 1.7rem;
      left: calc(50% - 2.25rem);
    }
    .witch-skirt::after {
      content: "";
      background-color: #8d65c9;
      width: 4.5rem; height: 0.5rem;
      position: absolute;
      top: 5rem;
      left: -2.25rem;
      border-radius: 0 0 50% 50%/0 0 100% 100%;
    }
    .witch-shirt {
      width: 0; height: 3rem;
      border-left: solid 1rem transparent;
      border-right: solid 1rem transparent;
      border-top: 0;
      border-bottom: solid 3rem #ffffff;
      position: absolute;
      top: 1.95rem;
      left: calc(50% - 1rem);
    }
    .witch-shirt::before, .witch-shirt::after {
      content: "";
      background-color: #e3d132;
      width: 0.5rem; height: 0.5rem;
      position: absolute;
      top: 3.25rem;
      border-radius: 100%;
    }
    .witch-shirt::before { right: 0.75rem; }
    .witch-shirt::after { left: 0.75rem; }
    .witch-arm {
      width: 1.5rem; height: 2.5rem;
      position: absolute;
      top: 4.4rem;
      transform-origin: top center;
    }
    .witch-arm.left { left: -1.3rem; transform: rotate(65deg); }
    .witch-arm.left .sleeve { left: 0; }
    .witch-arm.left .hand { left: 0.1rem; }
    .witch-arm.right { right: -1.3rem; transform: rotate(-65deg); }
    .witch-arm.right .sleeve { right: 0; }
    .witch-arm.right .hand { right: 0.1rem; }
    .witch-arm .sleeve {
      background-color: #ffffff;
      width: 1.2rem; height: 1.9rem;
      position: absolute;
      top: 0;
      border-radius: 99999px 99999px 0 0;
    }
    .witch-arm .hand {
      background-color: #f7d199;
      width: 0.9rem; height: 1.1rem;
      position: absolute;
      bottom: 0;
      border-radius: 99999px;
    }
    .witch-leg {
      background-color: #f7d199;
      width: 1rem; height: 2rem;
      overflow: hidden;
      position: absolute;
      top: 6.75rem;
      border-radius: 0 0 99999px 99999px;
      transform-origin: top center;
    }
    .witch-leg.left { left: -1.25rem; transform: skewX(4deg); }
    .witch-leg.right { right: -1.25rem; transform: skewX(-4deg); }
    .witch-leg .shoe {
      background-color: #371c5e;
      width: 100%; height: 0.8rem;
      position: absolute;
      bottom: 0;
    }
    .witch-leg .shoe::after {
      content: "";
      background-color: #f7d199;
      width: 100%; height: 0.3rem;
      position: absolute;
      top: 0;
      border-radius: 0% 0% 50% 50%/0% 0% 100% 100%;
    }

    /* ============================================================
       BRUJITA VISIBLE POR DEFECTO
       ============================================================ */
    .person-1 {
      position: absolute;
      top: -2.75rem;
      left: calc(50% - 2.1rem);
      opacity: 1;
      transform: scale(1);
      filter: drop-shadow(0rem 0.5rem 0.75rem rgba(0, 0, 0, 0.55));
      transition: top 380ms cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  opacity 380ms cubic-bezier(0.18, 0.89, 0.32, 1.28),
                  transform 380ms cubic-bezier(0.18, 0.89, 0.32, 1.28);
      pointer-events: none;
      z-index: 5;
    }

    /* ---------------- ASOMAR MANOS ---------------- */
    .peek {
      width: 0; height: 0;
      position: absolute;
      top: 0; left: 50%;
      visibility: hidden;
      pointer-events: none;
    }
    .peek .hand {
      background-color: #f7d199;
      width: 1.125rem; height: 0.6875rem;
      position: absolute;
      top: 0rem;
      border-radius: 99999px 99999px 0 0;
      filter: drop-shadow(0rem 0.5rem 0.75rem rgba(0, 0, 0, 0.5));
      transition: height 380ms ease-out, top 380ms cubic-bezier(0.18, 0.89, 0.32, 1.28), border-radius 380ms ease-out;
    }
    .peek .hand.left { left: -3.25rem; }
    .peek .hand.right { right: -3.25rem; }

    /* ---------------- CALABAZA (CON BRILLO) ---------------- */
    .pumpkin {
      background-color: #d96d16;
      width: 5rem; height: 3rem;
      border-radius: 99999px;
      position: absolute;
      top: 5rem;
      left: 8rem;
      opacity: 0;
      transform: scale(0);
      filter: drop-shadow(0rem 0.5rem 0.75rem rgba(0, 0, 0, 0.5));
      pointer-events: none;
      z-index: 20;
    }
    .pumpkin .stem {
      width: 0; height: 1.25rem;
      border-left: solid 0.3125rem transparent;
      border-right: solid 0.3125rem transparent;
      border-top: solid 1.25rem #356e0d;
      border-bottom: 0;
      position: absolute;
      bottom: 100%;
      left: calc(50% - 0.3125rem);
    }
    .pumpkin .pumpkin-eye {
      width: 0; height: 0.75rem;
      border-left: solid 0.575rem transparent;
      border-right: solid 0.575rem transparent;
      border-top: 0;
      border-bottom: solid 0.75rem #1f1f1f;
      position: absolute;
      top: 0.5rem;
    }
    .pumpkin .pumpkin-eye.left { left: 0.9rem; }
    .pumpkin .pumpkin-eye.right { right: 0.9rem; }
    .pumpkin .pumpkin-mouth {
      background-color: #1f1f1f;
      width: 3rem; height: 1rem;
      position: absolute;
      top: 1.65rem;
      left: calc(50% - 1.5rem);
      border-radius: 0 0 99999px 99999px;
    }
    .pumpkin .pumpkin-mouth::before, .pumpkin .pumpkin-mouth::after {
      content: "";
      background-color: #d96d16;
      width: 0.5rem; height: 0.4rem;
      position: absolute;
    }
    .pumpkin .pumpkin-mouth::before { top: 0; left: 0.5rem; }
    .pumpkin .pumpkin-mouth::after { bottom: 0; left: 1.75rem; }

    /* ============================================================
       GLOBO DE DIÁLOGO
       ============================================================ */
    .dialogo {
      position: absolute;
      bottom: calc(100% + 3.5rem);
      left: 50%;
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      background: #ffffff;
      color: #740b85;
      padding: 0.7rem 1.3rem;
      border-radius: 1rem;
      font-size: 1.15rem;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      border: 2px solid #8d65c9;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
    }
    .dialogo::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 9px solid transparent;
      border-top-color: #ffffff;
      filter: drop-shadow(0 2px 0 #8d65c9);
    }

    /* ============================================================
       INTERACCIONES
       ============================================================ */
    .trick_or_treat:hover:not(:focus) + .container > .person-1,
    .trick_or_treat:active:not(:focus) + .container > .person-1 {
      top: -3.5rem;
      transform: scale(1.05);
    }
    .trick_or_treat:hover:not(:focus) + .container > .person-1 .face-container,
    .trick_or_treat:active:not(:focus) + .container > .person-1 .face-container {
      animation: peek 3000ms ease-out infinite;
    }

    #TrickOrTreat:not(:target) .trick_or_treat:hover + .container > .peek,
    #TrickOrTreat:not(:target) .trick_or_treat:active + .container > .peek {
      visibility: visible;
      animation: to-front 0ms 190ms forwards;
    }
    #TrickOrTreat:not(:target) .trick_or_treat:hover + .container > .peek .hand,
    #TrickOrTreat:not(:target) .trick_or_treat:active + .container > .peek .hand {
      animation: peek-hand-pre 190ms ease-out,
                 to-front 0ms 190ms forwards,
                 peek-hand-post 190ms ease-in forwards;
    }

    /* ============================================================
       CLIC — SECUENCIA COMPLETA
       ============================================================ */
    #TrickOrTreat:target > .container > .person-1 {
      opacity: 1;
      transform: scale(1);
      animation: jump 256ms ease-out forwards,
                 to-front 0ms 256ms forwards,
                 fall 256ms ease-in 256ms forwards,
                 go-near 1400ms 512ms cubic-bezier(0.34, 1.2, 0.64, 1) forwards;
    }

    /* 🦵 PIES CAMINANDO */
    #TrickOrTreat:target > .container > .person-1 .witch-leg.left {
      animation: walk-left 350ms ease-in-out 512ms 4 alternate;
    }
    #TrickOrTreat:target > .container > .person-1 .witch-leg.right {
      animation: walk-right 350ms ease-in-out 512ms 4 alternate;
    }

    #TrickOrTreat:target > .container > .person-1 .face-container {
      animation: get-item-face 800ms 812ms ease-out forwards,
                 get-item-face 500ms 2562ms ease-out reverse forwards;
    }
    #TrickOrTreat:target > .container > .person-1 .witch-arm.left {
      animation: get-item-arm-left 1500ms 812ms forwards,
                 trick-or-treat-arm-left 500ms 2562ms ease-out forwards;
    }
    #TrickOrTreat:target > .container > .person-1 .witch-arm.right {
      animation: get-item-arm-right 1500ms 812ms forwards,
                 trick-or-treat-arm-right 500ms 2562ms ease-out forwards;
    }

    #TrickOrTreat:target > .container > .person-1 .face .eye {
      background-color: transparent;
      border-top: solid 0.125rem;
      border-left: solid 0.125rem;
      border-right: solid 0.125rem;
      border-radius: 99999px 99999px 0 0;
    }
    #TrickOrTreat:target > .container > .person-1 .face .eye::after { opacity: 0; }
    #TrickOrTreat:target > .container > .person-1 .face .mouth {
      background-color: #e079b7;
      width: 1.25rem; height: 0.75rem;
      border: solid 0px;
      left: calc(50% - 0.625rem);
    }

    /* 🎃 CALABAZA BRILLANTE */
    #TrickOrTreat:target > .container > .pumpkin {
      top: 6rem;
      left: calc(50% - 2.5rem);
      opacity: 1;
      transform: scale(1.15);
      z-index: 20;
      transition: top 500ms 2562ms ease-out,
                  left 500ms 2562ms ease-out,
                  opacity 100ms 2262ms ease-out,
                  transform 400ms 2262ms cubic-bezier(0.34, 1.56, 0.64, 1);
      animation: pumpkin-glow 1400ms 2562ms ease-in-out infinite;
    }

    #TrickOrTreat:target > .container > .dialogo {
      animation: dialog-appear 800ms 3300ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 dialog-float 2400ms 4200ms ease-in-out infinite;
    }

    /* ============================================================
       BOTÓN PRINCIPAL
       ============================================================ */
    .trick_or_treat {
      color: #ffffff;
      text-decoration: none;
      font-family: inherit;
      font-size: 2rem;
      background-color: #1a64ed;
      padding: 1.5rem 2rem;
      border: 0;
      outline: 0;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      border-radius: 1rem;
      box-shadow: 0 0.5rem #0e46af;
      cursor: pointer;
      z-index: 10;
      transition: background-color 24ms ease-out,
                  box-shadow 24ms ease-out,
                  transform 24ms ease-out;
    }
    .trick_or_treat:hover { background-color: #3475ef; }
    .trick_or_treat:active {
      background-color: #1259de;
      box-shadow: 0 0 #0e46af;
      transform: translateY(0.5rem);
    }
    .trick_or_treat small { font-size: 1rem; }

    /* ============================================================
       KEYFRAMES
       ============================================================ */
    @keyframes peek {
      20% { transform: translateZ(2rem); }
      40% { transform: translateZ(2rem) rotateY(-7.5deg); }
      80% { transform: translateZ(2rem) rotateY(7.5deg); }
      100% { transform: translateZ(2rem); }
    }
    @keyframes peek-hand-pre {
      0% { top: 0rem; }
      100% { top: -0.6875rem; }
    }
    @keyframes peek-hand-post {
      0% { top: -0.6875rem; border-radius: 99999px 99999px 0 0; }
      100% { top: -0.2rem; border-radius: 99999px; }
    }
    @keyframes to-front { 100% { z-index: 20; } }
    @keyframes jump {
      0% { top: -3.5rem; }
      100% { top: -15rem; }
    }
    @keyframes fall {
      0% { top: -15rem; }
      100% { top: 0rem; }
    }

    @keyframes go-near {
      0%   { transform: scale(1); }
      20%  { transform: scale(1.35); }
      40%  { transform: scale(1.7); }
      60%  { transform: scale(2); }
      80%  { transform: scale(2.25); }
      100% { transform: scale(2.4); }
    }

    @keyframes walk-left {
      0%   { transform: skewX(4deg) rotate(-16deg); }
      100% { transform: skewX(4deg) rotate(16deg); }
    }
    @keyframes walk-right {
      0%   { transform: skewX(-4deg) rotate(16deg); }
      100% { transform: skewX(-4deg) rotate(-16deg); }
    }

    @keyframes pumpkin-glow {
      0%, 100% {
        filter: drop-shadow(0rem 0.5rem 0.75rem rgba(0, 0, 0, 0.5))
                drop-shadow(0 0 8px #ffb347)
                drop-shadow(0 0 18px #ff8c00);
      }
      50% {
        filter: drop-shadow(0rem 0.5rem 0.75rem rgba(0, 0, 0, 0.5))
                drop-shadow(0 0 18px #ffd166)
                drop-shadow(0 0 34px #ff8c00)
                drop-shadow(0 0 54px rgba(255, 100, 0, 0.8));
      }
    }

    @keyframes get-item-face {
      0% { transform: translateZ(2rem); }
      100% { transform: translateZ(2rem) rotateX(7.5deg) rotateY(-7.5deg); }
    }
    @keyframes get-item-arm-left {
      0% { transform: rotate(65deg); z-index: 30; }
      20% { left: -2.05rem; transform: scaleX(-1) rotate(70deg); }
      40% { transform: scaleX(-1) rotate(60deg); }
      60% { transform: scaleX(-1) rotate(70deg); }
      80% { transform: scaleX(-1) rotate(60deg); }
      100% { left: -2.05rem; transform: scaleX(-1) rotate(65deg); z-index: 30; }
    }
    @keyframes get-item-arm-right {
      0% { transform: rotate(-65deg); }
      20% { transform: rotate(-60deg); }
      40% { transform: rotate(-70deg); }
      60% { transform: rotate(-60deg); }
      80% { transform: rotate(-70deg); }
      100% { transform: rotate(-65deg); }
    }
    @keyframes trick-or-treat-arm-left {
      0% { left: -2.05rem; transform: scaleX(-1) rotate(65deg); z-index: 30; }
      100% {
        top: 4.15rem;
        left: -2.1571428571rem;
        transform: scaleX(-1) rotate(35deg);
        z-index: 30;
      }
    }
    @keyframes trick-or-treat-arm-right {
      0% { transform: rotate(-65deg); z-index: 30; }
      100% {
        top: 4.15rem;
        right: -2.1571428571rem;
        transform: scaleX(-1) rotate(-35deg);
        z-index: 30;
      }
    }

    @keyframes dialog-appear {
      0%   { opacity: 0; transform: translateX(-50%) scale(0) rotate(-15deg); }
      50%  { opacity: 1; transform: translateX(-50%) scale(1.25) rotate(5deg); }
      75%  { transform: translateX(-50%) scale(0.95) rotate(-3deg); }
      100% { opacity: 1; transform: translateX(-50%) scale(1) rotate(0deg); }
    }
    @keyframes dialog-float {
      0%, 100% { transform: translateX(-50%) translateY(0) rotate(0deg); }
      25%      { transform: translateX(-50%) translateY(-6px) rotate(-2deg); }
      75%      { transform: translateX(-50%) translateY(-6px) rotate(2deg); }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 480px) {
      .trick_or_treat { font-size: 1.5rem; padding: 1.2rem 1.5rem; }
      .trick_or_treat small { font-size: 0.85rem; }
      .dialogo { font-size: 0.95rem; padding: 0.5rem 0.9rem; bottom: calc(100% + 2.5rem); }
      .marca { font-size: 0.85rem; padding: 0.45rem 0.9rem; }
      .btn { font-size: 0.88rem; padding: 0.75rem 1rem; flex: 1 1 140px; }
      body { padding: 5rem 0.5rem 9rem; }
    }
  </style>
</head>

<body>

  <main class="escenario">

      <div class="container">

          "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(msgPersonalizar);
      }

      /* ==========================================================
         🎃 GENERAR CALABACITAS ESTÁTICAS DE FONDO
         ========================================================== */
      function crearFondoCalabazas() {
        var fondo = document.getElementById("fondoCalabazas");
        if (!fondo) return;

        var cantidad = 14;

        for (var i = 0; i < cantidad; i++) {
          var p = document.createElement("div");
          p.className = "bg-pumpkin";

          var tamano = 45 + Math.random() * 85;
          p.style.width = tamano + "px";
          p.style.height = (tamano * 0.75) + "px";
          p.style.left = (Math.random() * 92) + "vw";
          p.style.top = (Math.random() * 88) + "vh";

          /* Rotación ligera aleatoria */
          var rot = (Math.random() * 40 - 20);
          p.style.transform = "rotate(" + rot + "deg)";

          /* Retardar la respiración para que no todas pulsan al mismo tiempo */
          p.style.animationDelay = (Math.random() * 4) + "s";

          /* Destello brillante encima */
          var s = document.createElement("div");
          s.className = "bg-sparkle";
          s.style.left = (20 + Math.random() * 60) + "%";
          s.style.top = (10 + Math.random() * 60) + "%";
          s.style.animationDelay = (Math.random() * 2.2) + "s";
          p.appendChild(s);

          fondo.appendChild(p);
        }
      }

      crearFondoCalabazas();
    })();
  </script>
