<script>

  ice:{name:"Cristal Azul",emoji:"❄️",premium:true,colors:["#e0f2fe","#bae6fd","#7dd3fc","#38bdf8","#0ea5e9"]}
};

var state = {

function $(id){ return document.getElementById(id); }
function showStatus(msg, ok){
  var s = $("status");
  s.textContent = msg;
  s.classList.toggle("err", ok === false);
  s.classList.add("show");
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(function(){ s.classList.remove("show"); }, 3400);
}
function showLoading(v, txt){
  $("loading").classList.toggle("show", !!v);
  if (txt) $("loading-text").textContent = txt;
}
function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function slugify(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "neural";
}

var PREMIUM_MESSAGES = {
  music: "<b>Música personalizada:</b> sube tu propia canción para que suene mientras tu pareja explora la red neuronal estelar.",

  pulse: "<b>Ondas largas:</b> pulsos 3× más largos y potentes que hacen vibrar todas las partículas al tocar.",
  palette: "<b>Paletas exclusivas:</b> Sunset Fire, Ocean Aurora, Nebulosa Rosa, Dorado Estelar y Cristal Azul."
};

function showPremium(feature){
  $("premium-feature-text").innerHTML = PREMIUM_MESSAGES[feature] || "Desbloquea funciones exclusivas.";
  $("premium-modal").classList.add("show");
}
function closePremium(){ $("premium-modal").classList.remove("show"); }
function initPremium(){
  $("premium-close").onclick = closePremium;
  $("premium-later").onclick = closePremium;
  $("premium-modal").onclick = function(e){ if (e.target === $("premium-modal")) closePremium(); };
  $("premium-upgrade").onclick = function(){ window.open(PREMIUM_URL, "_blank"); };
  $("i-music").addEventListener("click", function(e){ if (!isPremium){ e.preventDefault(); showPremium("music"); } });
  $("music-drop").addEventListener("click", function(e){ if (!isPremium){ e.preventDefault(); showPremium("music"); } });
  $("premium-fx").addEventListener("click", function(e){ e.preventDefault(); if (!isPremium) showPremium("fx"); else showStatus("Densidad máxima activada ✓"); });
  $("premium-secret").addEventListener("click", function(e){ e.preventDefault(); if (!isPremium) showPremium("secret"); else showStatus("Formaciones secretas activadas ✓"); });
  $("premium-pulse").addEventListener("click", function(e){ e.preventDefault(); if (!isPremium) showPremium("pulse"); else showStatus("Ondas largas activadas ✓"); });

function applyPremiumState(){
  if (!isPremium) return;
  $("premium-active-banner").classList.add("show");
  document.querySelectorAll(".premium-tag").forEach(function(el){
    el.textContent = "✓ DESBLOQUEADO";
    el.style.background = "rgba(34,197,94,.12)";
    el.style.borderColor = "rgba(74,222,128,.4)";
    el.style.color = "#4ade80";
  });
  document.querySelectorAll(".file-drop.premium").forEach(function(el){ el.classList.add("unlocked"); });
  $("phrases-limit-text").textContent = "frases ilimitadas";
}

function renderPalettes(){
  var grid = $("palette-grid"); grid.innerHTML = "";
  Object.keys(PALETTES).forEach(function(key){
    var pal = PALETTES[key];
    var locked = pal.premium && !isPremium;
    var b = document.createElement("button"); b.type = "button";
    b.className = "pal-btn" + (key === state.palette ? " active" : "") + (locked ? " locked" : "");
    var sw = document.createElement("div"); sw.className = "pal-swatches";
    pal.colors.forEach(function(c){
      var s = document.createElement("div"); s.className = "pal-swatch"; s.style.background = c;
      sw.appendChild(s);
    });
    var t = document.createElement("div"); t.textContent = pal.emoji + " " + pal.name; t.style.flex = "1";
    b.appendChild(sw); b.appendChild(t);
    b.onclick = function(){
      if (locked){ showPremium("palette"); return; }
      state.palette = key; renderPalettes();
    };
    grid.appendChild(b);
  });
}

function enforcePhrasesLimit(){
  if (isPremium) return;
  var ta = $("i-phrases");
  var lines = ta.value.split("\n");
  if (lines.length > MAX_PHRASES_FREE){
    ta.value = lines.slice(0, MAX_PHRASES_FREE).join("\n");
    showPremium("phrases");
  }
}

function readInputs(){
  state.name = $("i-name").value.trim() || "Mi amor";
  state.fromName = $("i-from").value.trim();
  state.startDate = $("i-date").value;
  state.subtitle = $("i-sub").value.trim() || "Toca la pantalla para enviar energía ✨";
  state.customPhrases = $("i-phrases").value.trim();
}

async function buildNeuralHTML(){
  var name = state.name, fromName = state.fromName, subtitle = state.subtitle;
  var paletteKey = state.palette;
  var customLines = state.customPhrases.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
  var phrases = customLines.length ? customLines : DEFAULT_PHRASES.slice(0, 1);
  var phrasesJSON = JSON.stringify(phrases);
  var palettesJSON = JSON.stringify(PALETTES);
  var startDateJSON = JSON.stringify(state.startDate || null);
  var customMusicJSON = JSON.stringify(state.customMusic || null);
  var isPremiumJSON = JSON.stringify(isPremium);

  var NOISE_FN = [

    'vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }',
    'vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }',
    'float snoise(vec3 v) {',
    '  const vec2 C = vec2(1.0/6.0, 1.0/3.0);',
    '  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);',
    '  vec3 i = floor(v + dot(v, C.yyy));',
    '  vec3 x0 = v - i + dot(i, C.xxx);',
    '  vec3 g = step(x0.yzx, x0.xyz);',
    '  vec3 l = 1.0 - g;',
    '  vec3 i1 = min(g.xyz, l.zxy);',
    '  vec3 i2 = max(g.xyz, l.zxy);',
    '  vec3 x1 = x0 - i1 + C.xxx;',
    '  vec3 x2 = x0 - i2 + C.yyy;',
    '  vec3 x3 = x0 - D.yyy;',
    '  i = mod289(i);',
    '  vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));',
    '  float n_ = 0.142857142857;',
    '  vec3 ns = n_ * D.wyz - D.xzx;',
    '  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);',
    '  vec4 x_ = floor(j * ns.z);',
    '  vec4 y_ = floor(j - 7.0 * x_);',
    '  vec4 x = x_ * ns.x + ns.yyyy;',
    '  vec4 y = y_ * ns.x + ns.yyyy;',
    '  vec4 h = 1.0 - abs(x) - abs(y);',
    '  vec4 b0 = vec4(x.xy, y.xy);',
    '  vec4 b1 = vec4(x.zw, y.zw);',
    '  vec4 s0 = floor(b0) * 2.0 + 1.0;',
    '  vec4 s1 = floor(b1) * 2.0 + 1.0;',
    '  vec4 sh = -step(h, vec4(0.0));',
    '  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;',
    '  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;',
    '  vec3 p0 = vec3(a0.xy, h.x);',
    '  vec3 p1 = vec3(a0.zw, h.y);',
    '  vec3 p2 = vec3(a1.xy, h.z);',
    '  vec3 p3 = vec3(a1.zw, h.w);',
    '  vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));',
    '  p0 *= norm.x;',
    '  p1 *= norm.y;',
    '  p2 *= norm.z;',
    '  p3 *= norm.w;',
    '  vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);',
    '  m = m * m;',
    '  return 42.0 * dot(m * m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));',
    '}'
  ].join('\n');

  // NODE VERTEX — TAMAÑO GRANDE cuando forma frase
  var NODE_VERTEX = [
    'uniform float uTime;',
    'uniform float uMorph;',
    'uniform vec3 uPulsePositions[3];',
    'uniform float uPulseTimes[3];',
    'uniform float uPulseSpeed;',
    'uniform float uBaseNodeSize;',
    'uniform float uPulseDuration;',
    'attribute float nodeSize;',
    'attribute float nodeType;',
    'attribute vec3 nodeColor;',
    'attribute float distanceFromRoot;',
    'attribute vec3 targetPosition;',
    'varying vec3 vColor;',
    'varying float vNodeType;',
    'varying vec3 vPosition;',
    'varying float vPulseIntensity;',
    'varying float vDistanceFromRoot;',
    'varying float vGlow;',
    'varying float vMorph;',
    NOISE_FN,
    'float getPulseIntensity(vec3 worldPos, vec3 pulsePos, float pulseTime) {',
    '  if (pulseTime < 0.0) return 0.0;',
    '  float timeSinceClick = uTime - pulseTime;',
    '  if (timeSinceClick < 0.0 || timeSinceClick > uPulseDuration) return 0.0;',
    '  float pulseRadius = timeSinceClick * uPulseSpeed;',
    '  float distToClick = distance(worldPos, pulsePos);',
    '  float pulseThickness = 3.0;',
    '  float waveProximity = abs(distToClick - pulseRadius);',
    '  return smoothstep(pulseThickness, 0.0, waveProximity) * smoothstep(uPulseDuration, 0.0, timeSinceClick);',
    '}',
    'void main() {',
    '  vNodeType = nodeType;',
    '  vColor = nodeColor;',
    '  vDistanceFromRoot = distanceFromRoot;',
    '  vMorph = uMorph;',
    '  vec3 networkPos = position;',
    '  vec3 finalPos = mix(networkPos, targetPosition, uMorph);',
    '  vec3 worldPos = (modelMatrix * vec4(finalPos, 1.0)).xyz;',
    '  vPosition = worldPos;',
    '  float totalPulseIntensity = 0.0;',
    '  for (int i = 0; i < 3; i++) {',
    '    totalPulseIntensity += getPulseIntensity(worldPos, uPulsePositions[i], uPulseTimes[i]);',
    '  }',
    '  vPulseIntensity = min(totalPulseIntensity, 1.0);',
    '  float breathe = sin(uTime * 0.7 + distanceFromRoot * 0.15) * 0.15 + 0.85;',
    '  float baseSize = nodeSize * breathe;',
    '  float pulseSize = baseSize * (1.0 + vPulseIntensity * 2.0);',
    '  vGlow = 0.5 + 0.5 * sin(uTime * 0.5 + distanceFromRoot * 0.2);',
    '  vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);',
    // *** CLAVE 1: sizeFactor de 60 → 380 en modo frase + clamp hasta 6px ***
    '  float sizeFactor = mix(1000.0, 380.0, uMorph);',
    '  gl_PointSize = clamp(pulseSize * uBaseNodeSize * (sizeFactor / -mvPosition.z), 1.2, 6.0);',
    '  gl_Position = projectionMatrix * mvPosition;',
    '}'
  ].join('\n');

  // NODE FRAGMENT — alpha 1.0 y color reforzado en modo frase
  var NODE_FRAGMENT = [
    'uniform float uTime;',
    'uniform vec3 uPulseColors[3];',
    'varying vec3 vColor;',
    'varying float vNodeType;',
    'varying vec3 vPosition;',
    'varying float vPulseIntensity;',
    'varying float vDistanceFromRoot;',
    'varying float vGlow;',
    'varying float vMorph;',
    'void main() {',
    '  vec2 center = 2.0 * gl_PointCoord - 1.0;',
    '  float dist = length(center);',
    '  if (dist > 1.0) discard;',
    '  float breatheColor = 0.92 + 0.08 * sin(uTime * 0.6 + vDistanceFromRoot * 0.25);',
    '  vec3 baseColor = vColor * breatheColor;',
    '  float glow1 = 1.0 - smoothstep(0.0, 0.40, dist);',
    '  float glow2 = 1.0 - smoothstep(0.0, 0.80, dist);',
    '  float glow3 = 1.0 - smoothstep(0.0, 1.00, dist);',
    '  float glowStrengthN = pow(glow1, 1.0) + glow2 * 0.55 + glow3 * 0.28;',
    '  vec3 colorN = baseColor;',
    '  if (vPulseIntensity > 0.0) {',
    '    vec3 pc = mix(vec3(1.0), uPulseColors[0], 0.35);',
    '    colorN = mix(baseColor, pc, vPulseIntensity * 0.85);',
    '    colorN *= (1.0 + vPulseIntensity * 1.5);',
    '    glowStrengthN *= (1.0 + vPulseIntensity * 1.1);',
    '  }',
    '  float coreN = smoothstep(0.55, 0.0, dist);',
    '  colorN += vec3(1.0) * coreN * 0.5;',
    '  float alphaN = glowStrengthN * (1.0 - 0.22 * dist);',
    // *** CLAVE 2: punto sólido, alpha 1.0, color reforzado 1.35x + brillo extra ***
    '  vec3 colorP = baseColor * 1.35 + vec3(0.08);',
    '  float alphaP = (dist < 0.7) ? 1.0 : 0.0;',
    '  vec3 finalColor = mix(colorN, colorP, vMorph);',
    '  float alpha = mix(alphaN, alphaP, vMorph);',
    '  float camDistance = length(vPosition - cameraPosition);',
    '  float distanceFade = smoothstep(100.0, 15.0, camDistance);',
    '  if (vNodeType > 0.5) { finalColor *= 1.1; alpha *= 0.95; }',
    '  finalColor *= (1.0 + vGlow * 0.15);',
    '  gl_FragColor = vec4(finalColor, alpha * distanceFade);',
    '}'
  ].join('\n');

  var CONN_VERTEX = [
    'uniform float uTime;',
    'uniform float uMorph;',
    'uniform vec3 uPulsePositions[3];',
    'uniform float uPulseTimes[3];',
    'uniform float uPulseSpeed;',
    'uniform float uPulseDuration;',
    'attribute vec3 startPoint;',
    'attribute vec3 endPoint;',
    'attribute float connectionStrength;',
    'attribute float pathIndex;',
    'attribute vec3 connectionColor;',
    'varying vec3 vColor;',
    'varying float vConnectionStrength;',
    'varying float vPulseIntensity;',
    'varying float vPathPosition;',
    'varying float vDistanceFromCamera;',
    'varying float vMorph;',
    NOISE_FN,
    'float getPulseIntensity(vec3 worldPos, vec3 pulsePos, float pulseTime) {',
    '  if (pulseTime < 0.0) return 0.0;',
    '  float timeSinceClick = uTime - pulseTime;',
    '  if (timeSinceClick < 0.0 || timeSinceClick > uPulseDuration) return 0.0;',
    '  float pulseRadius = timeSinceClick * uPulseSpeed;',
    '  float distToClick = distance(worldPos, pulsePos);',
    '  float pulseThickness = 3.0;',
    '  float waveProximity = abs(distToClick - pulseRadius);',
    '  return smoothstep(pulseThickness, 0.0, waveProximity) * smoothstep(uPulseDuration, 0.0, timeSinceClick);',
    '}',
    'void main() {',
    '  float t = position.x;',
    '  vPathPosition = t;',
    '  vec3 midPoint = mix(startPoint, endPoint, 0.5);',
    '  float pathOffset = sin(t * 3.14159) * 0.15;',
    '  vec3 perpendicular = normalize(cross(normalize(endPoint - startPoint), vec3(0.0, 1.0, 0.0)));',
    '  if (length(perpendicular) < 0.1) perpendicular = vec3(1.0, 0.0, 0.0);',
    '  midPoint += perpendicular * pathOffset;',
    '  vec3 p0 = mix(startPoint, midPoint, t);',
    '  vec3 p1 = mix(midPoint, endPoint, t);',
    '  vec3 finalPos = mix(p0, p1, t);',
    '  float noiseTime = uTime * 0.15;',
    '  float noise = snoise(vec3(pathIndex * 0.08, t * 0.6, noiseTime));',
    '  finalPos += perpendicular * noise * 0.12;',
    '  vec3 worldPos = (modelMatrix * vec4(finalPos, 1.0)).xyz;',
    '  float totalPulseIntensity = 0.0;',
    '  for (int i = 0; i < 3; i++) {',
    '    totalPulseIntensity += getPulseIntensity(worldPos, uPulsePositions[i], uPulseTimes[i]);',
    '  }',
    '  vPulseIntensity = min(totalPulseIntensity, 1.0);',
    '  vColor = connectionColor;',
    '  vConnectionStrength = connectionStrength;',
    '  vMorph = uMorph;',
    '  vDistanceFromCamera = length(worldPos - cameraPosition);',
    '  gl_Position = projectionMatrix * modelViewMatrix * vec4(finalPos, 1.0);',
    '}'
  ].join('\n');

  var CONN_FRAGMENT = [
    'uniform float uTime;',
    'uniform vec3 uPulseColors[3];',
    'varying vec3 vColor;',
    'varying float vConnectionStrength;',
    'varying float vPulseIntensity;',
    'varying float vPathPosition;',
    'varying float vDistanceFromCamera;',
    'varying float vMorph;',
    'void main() {',
    '  float flowPattern1 = sin(vPathPosition * 25.0 - uTime * 4.0) * 0.5 + 0.5;',
    '  float flowPattern2 = sin(vPathPosition * 15.0 - uTime * 2.5 + 1.57) * 0.5 + 0.5;',
    '  float combinedFlow = (flowPattern1 + flowPattern2 * 0.5) / 1.5;',
    '  vec3 baseColor = vColor * (0.9 + 0.2 * sin(uTime * 0.6 + vPathPosition * 12.0));',
    '  float flowIntensity = 0.5 * combinedFlow * vConnectionStrength;',
    '  vec3 finalColor = baseColor;',
    '  if (vPulseIntensity > 0.0) {',
    '    vec3 pulseColor = mix(vec3(1.0), uPulseColors[0], 0.25);',
    '    finalColor = mix(baseColor, pulseColor * 1.3, vPulseIntensity * 0.7);',
    '    flowIntensity += vPulseIntensity * 0.9;',
    '  }',
    '  finalColor *= (1.0 + flowIntensity + vConnectionStrength * 0.55);',
    '  float baseAlpha = 0.75 * vConnectionStrength;',
    '  float flowAlpha = combinedFlow * 0.3;',
    '  float alpha = baseAlpha + flowAlpha;',
    '  alpha = mix(alpha, min(1.0, alpha * 2.5), vPulseIntensity);',
    '  alpha *= (1.0 - vMorph * 0.99);',
    '  float distanceFade = smoothstep(100.0, 15.0, vDistanceFromCamera);',
    '  gl_FragColor = vec4(finalColor, alpha * distanceFade);',
    '}'
  ].join('\n');

  // FILLER VERTEX — TAMAÑO GRANDE en modo frase
  var FILLER_VERTEX = [
    'uniform float uTime;',
    'uniform float uMorph;',
    'attribute vec3 targetPosition;',
    'attribute vec3 aColor;',
    'attribute vec3 aRand;',
    'attribute float aActive;',
    'varying vec3 vColor;',
    'varying float vMorph;',
    'varying float vAlpha;',
    'void main() {',
    '  vec3 finalPos = mix(position, targetPosition, uMorph);',
    '  float noise = sin(uTime * 0.9 + aRand.x * 6.283) * 0.15 * (1.0 - uMorph);',
    '  finalPos += vec3(noise, noise * 0.7, noise * 0.5);',
    '  vColor = aColor;',
    '  vMorph = uMorph;',
    '  float activeMod = mix(1.0, aActive, uMorph);',
    '  vAlpha = (0.15 + uMorph * 0.85) * activeMod;',
    '  vec4 mvPos = modelViewMatrix * vec4(finalPos, 1.0);',
    '  gl_Position = projectionMatrix * mvPos;',
    // *** CLAVE 3: filler sizeFactor de 40 → 240 en modo frase, clamp hasta 5px ***
    '  float sizeFactor = mix(250.0, 240.0, uMorph);',
    '  gl_PointSize = clamp((1.15 + aRand.y * 0.55) * (sizeFactor / -mvPos.z), 1.0, 5.0);',
    '}'
  ].join('\n');

  // FILLER FRAGMENT — alpha 1.0 y color reforzado en modo frase
  var FILLER_FRAGMENT = [
    'varying vec3 vColor;',
    'varying float vMorph;',
    'varying float vAlpha;',
    'void main() {',
    '  vec2 uv = gl_PointCoord - vec2(0.5);',
    '  float d = length(uv);',
    '  if (d > 0.5) discard;',
    '  float alphaN = smoothstep(0.5, 0.15, d);',
    '  float coreN = smoothstep(0.18, 0.0, d);',
    '  vec3 colorN = vColor * 0.85 + vec3(1.0) * coreN * 0.2;',
    // *** CLAVE 4: punto sólido, alpha 1.0, color reforzado 1.3x ***
    '  float alphaP = (d < 0.6) ? 1.0 : 0.0;',
    '  vec3 colorP = vColor * 1.3 + vec3(0.05);',
    '  float alpha = mix(alphaN, alphaP, vMorph);',
    '  vec3 finalColor = mix(colorN, colorP, vMorph);',
    '  alpha *= mix(1.0, 1.0, vMorph);',
    '  gl_FragColor = vec4(finalColor, alpha * vAlpha);',
    '}'
  ].join('\n');

  // SPARKLE VERTEX — más grandes en modo frase para que brillen alrededor
  var SPARKLE_VERTEX = [
    'uniform float uTime;',
    'uniform float uMorph;',
    'attribute vec3 aColor;',
    'attribute vec3 aRand;',
    'attribute float aSize;',
    'attribute vec3 aPos;',
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'varying float vGlow;',
    'void main() {',
    '  vec3 finalPos = aPos;',
    '  float driftX = sin(uTime * 0.4 + aRand.x * 6.283) * 0.6;',
    '  float driftY = cos(uTime * 0.5 + aRand.y * 6.283) * 0.6;',
    '  float driftZ = sin(uTime * 0.3 + aRand.z * 6.283) * 0.4;',
    '  finalPos += vec3(driftX, driftY, driftZ) * uMorph;',
    '  vColor = aColor;',
    '  float twinkle = sin(uTime * (2.0 + aRand.x * 4.0) + aRand.y * 6.283) * 0.5 + 0.5;',
    '  twinkle = pow(twinkle, 1.8);',
    '  vGlow = twinkle;',
    '  vAlpha = twinkle * uMorph;',
    '  vec4 mvPos = modelViewMatrix * vec4(finalPos, 1.0);',
    '  gl_Position = projectionMatrix * mvPos;',
    '  float sizeFactor = mix(280.0, 180.0, uMorph);',
    '  gl_PointSize = clamp(aSize * (1.0 + twinkle * 1.5) * uMorph * (sizeFactor / -mvPos.z), 1.0, 4.0);',
    '}'
  ].join('\n');

  var SPARKLE_FRAGMENT = [
    'varying vec3 vColor;',
    'varying float vAlpha;',
    'varying float vGlow;',
    'void main() {',
    '  vec2 uv = gl_PointCoord - vec2(0.5);',
    '  float d = length(uv);',
    '  if (d > 0.5) discard;',
    '  float core = 1.0 - smoothstep(0.0, 0.22, d);',
    '  float halo = 1.0 - smoothstep(0.0, 0.5, d);',
    '  float alpha = (core * 1.4 + halo * 0.5) * vAlpha;',
    '  vec3 finalColor = vColor * (1.2 + vGlow * 1.5);',
    '  finalColor += vec3(1.0) * core * 0.25;',
    '  gl_FragColor = vec4(finalColor, alpha);',
    '}'
  ].join('\n');

  var NODE_VS_JSON = JSON.stringify(NODE_VERTEX);
  var NODE_FS_JSON = JSON.stringify(NODE_FRAGMENT);
  var CONN_VS_JSON = JSON.stringify(CONN_VERTEX);
  var CONN_FS_JSON = JSON.stringify(CONN_FRAGMENT);
  var FILLER_VS_JSON = JSON.stringify(FILLER_VERTEX);
  var FILLER_FS_JSON = JSON.stringify(FILLER_FRAGMENT);
  var SPARKLE_VS_JSON = JSON.stringify(SPARKLE_VERTEX);
  var SPARKLE_FS_JSON = JSON.stringify(SPARKLE_FRAGMENT);

  return `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

#days{position:fixed;top:max(52px,calc(env(safe-area-inset-top)+40px));left:50%;transform:translateX(-50%);font-size:12px;color:#7dd3fc;opacity:.9;z-index:30;text-align:center;text-shadow:0 0 10px rgba(125,211,252,.5)}

function createStarfield() {

    positions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
    const cc = Math.random();

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: 'attribute float size;attribute vec3 color;varying vec3 vColor;uniform float uTime;void main(){vColor=color;vec4 mvPosition=modelViewMatrix*vec4(position,1.0);float twinkle=sin(uTime*2.0+position.x*100.0)*0.3+0.7;gl_PointSize=size*twinkle*(300.0/-mvPosition.z);gl_Position=projectionMatrix*mvPosition;}',
    fragmentShader: 'varying vec3 vColor;void main(){vec2 center=gl_PointCoord-0.5;float dist=length(center);if(dist>0.5)discard;float alpha=1.0-smoothstep(0.0,0.5,dist);gl_FragColor=vec4(vColor,alpha*0.75);}',
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}
const starField = createStarfield();

const pulseUniforms = {

const NODE_VS = ${NODE_VS_JSON};
const NODE_FS = ${NODE_FS_JSON};
const CONN_VS = ${CONN_VS_JSON};
const CONN_FS = ${CONN_FS_JSON};
const FILLER_VS = ${FILLER_VS_JSON};
const FILLER_FS = ${FILLER_FS_JSON};
const SPARKLE_VS = ${SPARKLE_VS_JSON};
const SPARKLE_FS = ${SPARKLE_FS_JSON};

// ====== NETWORK ======
class Node {
  constructor(position, level = 0, type = 0) {
    this.position = position;
    this.connections = [];
    this.level = level;
    this.type = type;
    this.size = type === 0 ? THREE.MathUtils.randFloat(0.8, 1.4) : THREE.MathUtils.randFloat(0.5, 1.0);
    this.distanceFromRoot = 0;
  }
  addConnection(node, strength = 1.0) {
    if (!this.isConnectedTo(node)) {
      this.connections.push({ node, strength });
      node.connections.push({ node: this, strength });
    }
  }
  isConnectedTo(node) {
    return this.connections.some(conn => conn.node === node);
  }
}

function generateNetwork(densityFactor = 1.0) {
  const nodes = [];
  const rootNode = new Node(new THREE.Vector3(0, 0, 0), 0, 0);
  rootNode.size = 2.0;
  nodes.push(rootNode);
  const layers = 5;
  const goldenRatio = (1 + Math.sqrt(5)) / 2;
  for (let layer = 1; layer <= layers; layer++) {
    const radius = layer * 4;
    const numPoints = Math.floor(layer * 12 * densityFactor);
    for (let i = 0; i < numPoints; i++) {
      const phi = Math.acos(1 - 2 * (i + 0.5) / numPoints);
      const theta = 2 * Math.PI * i / goldenRatio;
      const pos = new THREE.Vector3(
        radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi)
      );
      const isLeaf = layer === layers || Math.random() < 0.3;
      const node = new Node(pos, layer, isLeaf ? 1 : 0);
      node.distanceFromRoot = radius;
      nodes.push(node);
      if (layer > 1) {
        const prevLayerNodes = nodes.filter(n => n.level === layer - 1 && n !== rootNode);
        prevLayerNodes.sort((a, b) => pos.distanceTo(a.position) - pos.distanceTo(b.position));
        for (let j = 0; j < Math.min(3, prevLayerNodes.length); j++) {
          const dist = pos.distanceTo(prevLayerNodes[j].position);
          const strength = 1.0 - (dist / (radius * 2));
          node.addConnection(prevLayerNodes[j], Math.max(0.3, strength));
        }
      } else {
        rootNode.addConnection(node, 0.9);
      }
    }
    const layerNodes = nodes.filter(n => n.level === layer && n !== rootNode);
    for (const node of layerNodes) {
      const nearby = layerNodes.filter(n => n !== node).sort((a, b) =>
        node.position.distanceTo(a.position) - node.position.distanceTo(b.position)
      ).slice(0, 5);
      for (const nearNode of nearby) {
        const dist = node.position.distanceTo(nearNode.position);
        if (dist < radius * 0.8 && !node.isConnectedTo(nearNode)) {
          node.addConnection(nearNode, 0.6);
        }
      }
    }
  }
  return { nodes, rootNode };
}

let nodesMesh = null, connectionsMesh = null, fillerMesh = null, sparkleMesh = null;
let phraseBounds = { w: 24, h: 12 };

function bakePhrase(text) {
  const canvas = document.createElement('canvas');
  canvas.width = 1600;
  canvas.height = 800;
  const g = canvas.getContext('2d', { willReadFrequently: true });
  g.fillStyle = '#fff';
  g.strokeStyle = '#fff';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  g.lineCap = 'round';

  let fontSize = 260;
  const len = text.length;
  if (len > 8) fontSize = 215;
  if (len > 14) fontSize = 178;
  if (len > 22) fontSize = 145;
  if (len > 32) fontSize = 118;
  if (len > 45) fontSize = 96;
  if (len > 60) fontSize = 78;

  g.font = '900 ' + fontSize + 'px "Arial Black",-apple-system,"Segoe UI",Arial,sans-serif';

  const maxWidth = canvas.width - 300;
  const words = text.split(/\\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);

  const lh = fontSize * 1.15;
  const totalH = lines.length * lh;
  const startY = canvas.height/2 - totalH/2 + lh/2;

  g.lineWidth = Math.max(4, fontSize * 0.04);
  lines.forEach((l, i) => {
    const y = startY + i*lh;
    g.strokeText(l, canvas.width/2, y);
    g.fillText(l, canvas.width/2, y);
  });

  const data = g.getImageData(0, 0, canvas.width, canvas.height).data;
  const points = [];
  const step = 3;
  const threshold = 60;
  for (let y = 0; y < canvas.height; y += step) {
    for (let x = 0; x < canvas.width; x += step) {
      const i = (y * canvas.width + x) * 4;
      if (data[i+3] > threshold) points.push({ x, y });
    }
  }
  if (!points.length) points.push({x:canvas.width/2, y:canvas.height/2});

  let minX = canvas.width, maxX = 0, minY = canvas.height, maxY = 0;
  points.forEach(p => {
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  });
  const pad = 8;
  minX = Math.max(0, minX - pad);
  maxX = Math.min(canvas.width, maxX + pad);
  minY = Math.max(0, minY - pad);
  maxY = Math.min(canvas.height, maxY + pad);

  const cxPx = (minX + maxX) / 2;
  const cyPx = (minY + maxY) / 2;
  const textW = Math.max(1, maxX - minX);
  const textH = Math.max(1, maxY - minY);
  const aspect = textW / textH;

  // *** TEXTO MÁS GRANDE ***
  const maxW = 24;
  const maxH = 12;
  let WORLD_W, WORLD_H;
  if (aspect > maxW / maxH) {
    WORLD_W = maxW; WORLD_H = maxW / aspect;
  } else {
    WORLD_H = maxH; WORLD_W = maxH * aspect;
  }
  phraseBounds.w = WORLD_W;
  phraseBounds.h = WORLD_H;

  for (let i = points.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = points[i]; points[i] = points[j]; points[j] = tmp;
  }

  return points.map(p => ({
    x: ((p.x - cxPx) / textW) * WORLD_W,
    y: -((p.y - cyPx) / textH) * WORLD_H,
    z: 0
  }));
}

let phraseIdx = 0;
let phrasePositions = null;
let morphValue = 0;
let morphTarget = 0;
let morphStart = 0;
let currentState = 'network';

function updatePhraseTargets(phrase) {
  phrasePositions = bakePhrase(phrase);
  const total = phrasePositions.length;
  if (!total) return;

  // *** CLAVE 5: jitter mínimo (0.04) para letras nítidas ***
  if (nodesMesh) {
    const attr = nodesMesh.geometry.attributes.targetPosition;
    const arr = attr.array;
    const count = attr.count;
    for (let i = 0; i < count; i++) {
      const p = phrasePositions[i % total];
      arr[i*3]   = p.x + (Math.random() - 0.5) * 0.04;
      arr[i*3+1] = p.y + (Math.random() - 0.5) * 0.04;
      arr[i*3+2] = (Math.random() - 0.5) * 0.1;
    }
    attr.needsUpdate = true;
  }

  // *** CLAVE 6: 40% de fillers van a la frase (antes 15%) → mucha más densidad ***
  if (fillerMesh) {
    const attr = fillerMesh.geometry.attributes.targetPosition;
    const activeAttr = fillerMesh.geometry.attributes.aActive;
    const arr = attr.array;
    const actArr = activeAttr.array;
    const count = attr.count;
    const toPhrase = Math.min(9000, Math.floor(count * 0.40));
    for (let i = 0; i < count; i++) {
      if (i < toPhrase) {
        const p = phrasePositions[i % total];
        arr[i*3]   = p.x + (Math.random() - 0.5) * 0.04;
        arr[i*3+1] = p.y + (Math.random() - 0.5) * 0.04;
        arr[i*3+2] = (Math.random() - 0.5) * 0.1;
        actArr[i] = 1.0;
      } else {
        arr[i*3]   = (Math.random() - 0.5) * 100;
        arr[i*3+1] = (Math.random() - 0.5) * 100;
        arr[i*3+2] = (Math.random() - 0.5) * 60;
        actArr[i] = 0.0;
      }
    }
    attr.needsUpdate = true;
    activeAttr.needsUpdate = true;
  }

  if (sparkleMesh) {
    const attr = sparkleMesh.geometry.attributes.aPos;
    const arr = attr.array;
    const count = attr.count;
    const marginX = phraseBounds.w * 0.5;
    const marginY = phraseBounds.h * 0.5;
    for (let i = 0; i < count; i++) {
      arr[i*3]   = (Math.random() - 0.5) * (phraseBounds.w + marginX * 2);
      arr[i*3+1] = (Math.random() - 0.5) * (phraseBounds.h + marginY * 2);
      arr[i*3+2] = (Math.random() - 0.5) * 6;
    }
    attr.needsUpdate = true;
  }
}

function buildFillerParticles() {
  const count = isPremium ? 25000 : 10000;
  const positions = new Float32Array(count * 3);
  const targets = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const randoms = new Float32Array(count * 3);
  const actives = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    const r = 6 + Math.random() * 22;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta) + 2;
    positions[i*3+2] = r * Math.cos(phi);

    targets[i*3] = positions[i*3];
    targets[i*3+1] = positions[i*3+1];
    targets[i*3+2] = positions[i*3+2];

    const c = palColors[Math.floor(Math.random() * palColors.length)];
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;

    randoms[i*3] = Math.random();
    randoms[i*3+1] = Math.random();
    randoms[i*3+2] = Math.random();

    actives[i] = 1.0;
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('targetPosition', new THREE.Float32BufferAttribute(targets, 3));
  geom.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
  geom.setAttribute('aRand', new THREE.Float32BufferAttribute(randoms, 3));
  geom.setAttribute('aActive', new THREE.Float32BufferAttribute(actives, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 }, uMorph: { value: 0.0 } },
    vertexShader: FILLER_VS, fragmentShader: FILLER_FS,
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.NormalBlending
  });

  fillerMesh = new THREE.Points(geom, mat);
  scene.add(fillerMesh);
}

function buildSparkles() {
  const count = isPremium ? 2200 : 800;
  const positions = new Float32Array(count * 3);
  const aPositions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const randoms = new Float32Array(count * 3);
  const sizes = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    positions[i*3] = (Math.random() - 0.5) * 100;
    positions[i*3+1] = (Math.random() - 0.5) * 100;
    positions[i*3+2] = (Math.random() - 0.5) * 100;

    aPositions[i*3] = (Math.random() - 0.5) * 40;
    aPositions[i*3+1] = (Math.random() - 0.5) * 25;
    aPositions[i*3+2] = (Math.random() - 0.5) * 8;

    const c = palColors[Math.floor(Math.random() * palColors.length)].clone();
    c.lerp(new THREE.Color(1,1,1), Math.random() * 0.4);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;

    randoms[i*3] = Math.random();
    randoms[i*3+1] = Math.random();
    randoms[i*3+2] = Math.random();

    const r = Math.random();
    sizes[i] = r < 0.85 ? (0.6 + Math.random() * 0.9) : (1.6 + Math.random() * 1.4);
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('aPos', new THREE.Float32BufferAttribute(aPositions, 3));
  geom.setAttribute('aColor', new THREE.Float32BufferAttribute(colors, 3));
  geom.setAttribute('aRand', new THREE.Float32BufferAttribute(randoms, 3));
  geom.setAttribute('aSize', new THREE.Float32BufferAttribute(sizes, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0.0 }, uMorph: { value: 0.0 } },
    vertexShader: SPARKLE_VS, fragmentShader: SPARKLE_FS,
    transparent: true, depthWrite: false, depthTest: false,
    blending: THREE.AdditiveBlending
  });

  sparkleMesh = new THREE.Points(geom, mat);
  scene.add(sparkleMesh);
}

function buildVisualization() {
  if (nodesMesh) { scene.remove(nodesMesh); nodesMesh.geometry.dispose(); nodesMesh.material.dispose(); }
  if (connectionsMesh) { scene.remove(connectionsMesh); connectionsMesh.geometry.dispose(); connectionsMesh.material.dispose(); }
  if (fillerMesh) { scene.remove(fillerMesh); fillerMesh.geometry.dispose(); fillerMesh.material.dispose(); }
  if (sparkleMesh) { scene.remove(sparkleMesh); sparkleMesh.geometry.dispose(); sparkleMesh.material.dispose(); }

  const network = generateNetwork(1.0);
  const nodes = network.nodes;

  const nodePos = [], nodeTypes = [], nodeSizes = [], nodeColors = [], distances = [], targetPos = [];
  nodes.forEach((node) => {
    nodePos.push(node.position.x, node.position.y, node.position.z);
    nodeTypes.push(node.type);
    nodeSizes.push(node.size);
    distances.push(node.distanceFromRoot);
    const ci = Math.min(node.level, palColors.length - 1);
    const baseColor = palColors[ci].clone();
    baseColor.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));
    nodeColors.push(baseColor.r, baseColor.g, baseColor.b);
    targetPos.push(node.position.x, node.position.y, node.position.z);
  });

  const nodeGeom = new THREE.BufferGeometry();
  nodeGeom.setAttribute('position', new THREE.Float32BufferAttribute(nodePos, 3));
  nodeGeom.setAttribute('nodeType', new THREE.Float32BufferAttribute(nodeTypes, 1));
  nodeGeom.setAttribute('nodeSize', new THREE.Float32BufferAttribute(nodeSizes, 1));
  nodeGeom.setAttribute('nodeColor', new THREE.Float32BufferAttribute(nodeColors, 3));
  nodeGeom.setAttribute('distanceFromRoot', new THREE.Float32BufferAttribute(distances, 1));
  nodeGeom.setAttribute('targetPosition', new THREE.Float32BufferAttribute(targetPos, 3));

  const nodeMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(pulseUniforms),
    vertexShader: NODE_VS, fragmentShader: NODE_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

  nodesMesh = new THREE.Points(nodeGeom, nodeMat);
  scene.add(nodesMesh);

  const connPos = [], connColors = [], connStrengths = [], startPts = [], endPts = [], pathIdxs = [];
  const processed = new Set();
  let pathIdx = 0;
  nodes.forEach((node, ni) => {
    node.connections.forEach(conn => {
      const ci = nodes.indexOf(conn.node);
      if (ci === -1) return;
      const key = [Math.min(ni, ci), Math.max(ni, ci)].join('-');
      if (processed.has(key)) return;
      processed.add(key);
      const numSeg = 20;
      for (let i = 0; i < numSeg; i++) {
        const t = i / (numSeg - 1);
        connPos.push(t, 0, 0);
        startPts.push(node.position.x, node.position.y, node.position.z);
        endPts.push(conn.node.position.x, conn.node.position.y, conn.node.position.z);
        pathIdxs.push(pathIdx);
        connStrengths.push(conn.strength);
        const avgLvl = Math.min(Math.floor((node.level + conn.node.level) / 2), palColors.length - 1);
        const cc = palColors[avgLvl].clone();
        cc.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));
        connColors.push(cc.r, cc.g, cc.b);
      }
      pathIdx++;
    });
  });

  const connGeom = new THREE.BufferGeometry();
  connGeom.setAttribute('position', new THREE.Float32BufferAttribute(connPos, 3));
  connGeom.setAttribute('startPoint', new THREE.Float32BufferAttribute(startPts, 3));
  connGeom.setAttribute('endPoint', new THREE.Float32BufferAttribute(endPts, 3));
  connGeom.setAttribute('connectionStrength', new THREE.Float32BufferAttribute(connStrengths, 1));
  connGeom.setAttribute('connectionColor', new THREE.Float32BufferAttribute(connColors, 3));
  connGeom.setAttribute('pathIndex', new THREE.Float32BufferAttribute(pathIdxs, 1));

  const connMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.clone(pulseUniforms),
    vertexShader: CONN_VS, fragmentShader: CONN_FS,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
  });

  connectionsMesh = new THREE.LineSegments(connGeom, connMat);
  scene.add(connectionsMesh);

  palColors.forEach((color, i) => {
    if (i < 3) {
      nodesMesh.material.uniforms.uPulseColors.value[i].copy(color);
      connectionsMesh.material.uniforms.uPulseColors.value[i].copy(color);
    }
  });

  buildFillerParticles();
  buildSparkles();
  updatePhraseTargets(CONFIG.phrases[phraseIdx]);
}

// ===== INTERACTION =====
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const interactionPoint = new THREE.Vector3();
let lastPulseIdx = 0;

function triggerPulse(clientX, clientY) {
  pointer.x = (clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  interactionPlane.normal.copy(camera.position).normalize();
  interactionPlane.constant = -interactionPlane.normal.dot(camera.position) + camera.position.length() * 0.5;
  if (raycaster.ray.intersectPlane(interactionPlane, interactionPoint)) {
    const time = clock.getElapsedTime();
    if (nodesMesh && connectionsMesh) {
      lastPulseIdx = (lastPulseIdx + 1) % 3;
      nodesMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);
      nodesMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = time;
      connectionsMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);
      connectionsMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = time;
      const randomColor = palColors[Math.floor(Math.random() * palColors.length)];
      nodesMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(randomColor);
      connectionsMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(randomColor);
    }
  }
}

let started = false;

let savedDistance = 28;
let targetCamDist = 28;
const frontCamPos = new THREE.Vector3();
const originTarget = new THREE.Vector3(0, 0, 0);

function computeNeededDistance() {
  const fovRad = camera.fov * Math.PI / 180;
  const aspect = Math.max(0.35, camera.aspect);
  const viewH = 2 * Math.tan(fovRad / 2);
  const dH = (phraseBounds.h * 1.25) / viewH;
  const dW = (phraseBounds.w * 1.25) / (viewH * aspect);
  return Math.max(dH, dW);
}

function triggerPhrase() {
  if (currentState !== 'network') return;
  currentState = 'toPhrase';
  morphStart = clock.getElapsedTime();
  morphTarget = 1;
  phraseIdx = (phraseIdx + 1) % CONFIG.phrases.length;
  updatePhraseTargets(CONFIG.phrases[phraseIdx]);

  savedDistance = camera.position.length();
  const needed = computeNeededDistance();
  // *** SIEMPRE encuadra bien la frase ***
  targetCamDist = needed * 1.08;
  frontCamPos.set(0, 0, targetCamDist);

  controls.autoRotate = false;

  magicBtn.classList.add('active');
  magicBtn.querySelector('.mb-text').textContent = 'Volver a la red neuronal';
  magicBtn.querySelector('.mb-icon').textContent = '✨';
}

function releasePhrase() {
  if (currentState !== 'phrase' && currentState !== 'toPhrase') return;
  currentState = 'toNetwork';
  morphStart = clock.getElapsedTime();
  morphTarget = 0;
  controls.autoRotate = true;

  magicBtn.classList.remove('active');
  magicBtn.querySelector('.mb-text').textContent = 'Haz click aquí y haz magia';
  magicBtn.querySelector('.mb-icon').textContent = '🪄';
}

const magicBtn = document.getElementById('magic-btn');
magicBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!started) return;
  if (currentState === 'network') {
    triggerPhrase();
  } else if (currentState === 'phrase' || currentState === 'toPhrase') {
    releasePhrase();
  }
});

function handleScreenTap(clientX, clientY) {
  if (!started) return;
  if (currentState === 'phrase' || currentState === 'toPhrase') {
    triggerPulse(clientX, clientY);
  }
}
window.addEventListener('click', (e) => {
  if (!started) return;
  if (e.target.closest('#music-btn') || e.target.closest('#music-panel') ||
      e.target.closest('.controls') || e.target.closest('.attribution') ||
      e.target.closest('#intro') || e.target.closest('#magic-btn')) return;
  handleScreenTap(e.clientX, e.clientY);
});
window.addEventListener('touchstart', (e) => {
  if (!started) return;
  const t = e.touches[0];
  if (!t) return;
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (el && (el.closest('#music-btn') || el.closest('#music-panel') || el.closest('.controls') ||
             el.closest('.attribution') || el.closest('#intro') || el.closest('#magic-btn'))) return;
  handleScreenTap(t.clientX, t.clientY);
}, { passive: true });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloomPass.resolution.set(window.innerWidth, window.innerHeight);
});

// ===== INTRO =====
const intro = document.getElementById('intro');
const iBtn = document.getElementById('iBtn');
iBtn.addEventListener('click', function(){
  if (started) return;
  started = true;
  intro.classList.add('hide');
  setTimeout(function(){ if (intro.parentNode) intro.style.display = 'none'; }, 1400);
  audio.play().then(() => { mpPlay.textContent = '⏸︎'; musicBtn.classList.add('playing'); musicBtn.textContent = '🎶'; }).catch(() => {});
}, { once: true });

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (currentState === 'toPhrase' || currentState === 'toNetwork') {
    const p = Math.min(1, (t - morphStart) / 1.6);
    const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;
    morphValue = currentState === 'toPhrase' ? e : 1 - e;
    if (p >= 1) {
      if (currentState === 'toPhrase') {
        currentState = 'phrase';
      } else {
        currentState = 'network';
        morphValue = 0;
      }
    }
  }

  if (currentState === 'toPhrase') {
    camera.position.lerp(frontCamPos, 0.08);
    controls.target.lerp(originTarget, 0.12);
  }

  const targetBloom = BASE_BLOOM + (PHRASE_BLOOM - BASE_BLOOM) * morphValue;
  bloomPass.strength += (targetBloom - bloomPass.strength) * 0.08;

  if (nodesMesh) {
    nodesMesh.material.uniforms.uTime.value = t;
    nodesMesh.material.uniforms.uMorph.value = morphValue;
    nodesMesh.rotation.y = Math.sin(t * 0.04) * 0.05 * (1 - morphValue);
  }
  if (connectionsMesh) {
    connectionsMesh.material.uniforms.uTime.value = t;
    connectionsMesh.material.uniforms.uMorph.value = morphValue;
    connectionsMesh.rotation.y = Math.sin(t * 0.04) * 0.05 * (1 - morphValue);
  }
  if (fillerMesh) {
    fillerMesh.material.uniforms.uTime.value = t;
    fillerMesh.material.uniforms.uMorph.value = morphValue;
    fillerMesh.rotation.y = Math.sin(t * 0.04) * 0.05 * (1 - morphValue);
  }
  if (sparkleMesh) {
    sparkleMesh.material.uniforms.uTime.value = t;
    sparkleMesh.material.uniforms.uMorph.value = morphValue;
    sparkleMesh.rotation.y = Math.sin(t * 0.04) * 0.05 * (1 - morphValue);
  }
  starField.rotation.y += 0.0002;
  starField.material.uniforms.uTime.value = t;
  controls.update();
  composer.render();
}

buildVisualization();
animate();
<\/script>

async function visualize(){
  readInputs();
  showLoading(true, "Preparando vista previa...");
  try {
    var html = await buildNeuralHTML();
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var modal = $("preview-modal");
    var iframe = $("preview-frame");
    iframe.src = "about:blank";
    setTimeout(function(){
      iframe.src = url;
      modal.classList.add("show");
      showLoading(false);
    }, 60);
    if (_previewURL) URL.revokeObjectURL(_previewURL);
    _previewURL = url;
  } catch(err){
    console.error(err);
    showStatus("Error: " + err.message, false);
    showLoading(false);
  }
}
function closePreview(){
  var modal = $("preview-modal");
  var iframe = $("preview-frame");
  if (modal) modal.classList.remove("show");
  if (iframe) iframe.src = "about:blank";
  if (_previewURL){ URL.revokeObjectURL(_previewURL); _previewURL = null; }
}

async function download(){
  readInputs();
  showLoading(true, "Empaquetando tu red neuronal...");
  try {
    var html = await buildNeuralHTML();
    var sizeKB = (html.length / 1024).toFixed(1);
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var filename = "red-neuronal-para-" + slugify(state.name) + ".html";
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a);
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      var w = window.open(url, "_blank");
      if (!w) { var modal = $("preview-modal"); var iframe = $("preview-frame"); iframe.src = url; modal.classList.add("show"); showStatus("En iOS: usa Compartir → Guardar en Archivos", false); }
      else { showStatus("En iOS: toca Compartir → Guardar en Archivos"); }
    } else {
      a.click();
      showStatus("¡Descargado! (" + sizeKB + " KB)");
    }
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(err){
    console.error(err);
    showStatus("Error: " + err.message, false);
  } finally {
    showLoading(false);
  }
}

function initEditor(){
  $("i-music").addEventListener("change", function(e){
    if (!isPremium){ e.target.value = ""; return; }
    var file = e.target.files[0]; if (!file) return;
    if (file.type.indexOf("audio/") !== 0){ showStatus("Solo archivos de audio", false); return; }
    if (file.size > 6 * 1024 * 1024){ showStatus("Máximo 6 MB de audio", false); return; }
    var rd = new FileReader();
    rd.onload = function(ev){
      state.customMusic = ev.target.result;
      $("m-label").textContent = "✓ " + file.name;
      $("music-drop").classList.add("has-file");
      showStatus("Música cargada ✓");
    };
    rd.readAsDataURL(file);
  });
  $("btn-view").addEventListener("click", visualize);
  $("btn-generate").addEventListener("click", download);
  $("close-preview").addEventListener("click", closePreview);
  ["i-name","i-from","i-date","i-sub"].forEach(function(id){
    $(id).addEventListener("input", readInputs);
  });
  $("i-phrases").addEventListener("input", function(){ enforcePhrasesLimit(); readInputs(); });
  renderPalettes();
  initPremium();
  applyPremiumState();
  readInputs();
}

initEditor();
