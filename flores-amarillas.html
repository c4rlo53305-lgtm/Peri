function escapeHtml(s){
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function readAndResize(file, maxW, quality){
  return new Promise(function(resolve){
    var rd = new FileReader();
    rd.onload = function(ev){
      var img = new Image();
      img.onload = function(){
        var s = Math.min(1, maxW / img.width);
        var w = Math.round(img.width * s);
        var h = Math.round(img.height * s);
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        cv.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(cv.toDataURL("image/jpeg", quality));
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(file);
  });
}

function renderFotosGrid(){
  var grid = $("fotos-grid");
  if (!grid) return;
  grid.innerHTML = "";
  data.fotos.forEach(function(url, i){
    var d = document.createElement("div");
    d.className = "mini-foto";
    d.innerHTML = '<img src="' + url + '" alt=""><button class="del" data-i="' + i + '">×</button>';
    grid.appendChild(d);
  });
  grid.querySelectorAll(".del").forEach(function(btn){
    btn.onclick = function(){
      var i = parseInt(btn.dataset.i);
      data.fotos.splice(i, 1);
      renderFotosGrid();
      updateContador();
    };
  });
  updateContador();
}

function updateContador(){
  var maxFotos = isPremium ? FOTOS_PREMIUM : FOTOS_GRATIS;
  var cantFotos = data.fotos.length;
  var pct = Math.min((cantFotos / maxFotos) * 100, 100);
  var cont = document.querySelector(".contador-fotos");
  if (cont){
    cont.querySelector("b").textContent = cantFotos + " / " + maxFotos;
    var b = cont.querySelector(".barra-inner");
    if (b) b.style.width = pct + "%";
  }
  var lbl = $("fotos-label");
  if (lbl){
    if (cantFotos === 0) lbl.textContent = "📷 Añadir fotos";
    else if (cantFotos >= maxFotos) lbl.textContent = isPremium ? "✓ Máximo alcanzado (10)" : "✓ 3 fotos subidas · Premium = hasta 10";
    else lbl.textContent = "✓ " + cantFotos + " foto" + (cantFotos > 1 ? "s" : "") + " · añadir más";
  }
}

function bindEditorEvents(){
  var btnPrev = $("btn-prev");
  var btnNext = $("btn-next");

  if (btnPrev) btnPrev.onclick = function(){
    if (pasoActual > 0){ guardarPaso(); pasoActual--; renderEditor(); }
  };
  if (btnNext) btnNext.onclick = function(){
    guardarPaso();
    if (pasoActual === TOTAL_PASOS - 1){ vistaPrevia(); return; }
    pasoActual++;
    renderEditor();
  };

  var inFotos = $("in-fotos");
  if (inFotos){
    renderFotosGrid();
    inFotos.addEventListener("change", async function(e){
      var files = Array.from(e.target.files || []);
      if (!files.length) return;
      var maxFotos = isPremium ? FOTOS_PREMIUM : FOTOS_GRATIS;
      var slots = maxFotos - data.fotos.length;
      if (slots <= 0){ showPremium("fotos"); e.target.value = ""; return; }
      if (!isPremium && files.length > slots) showPremium("fotos");
      files = files.slice(0, slots);
      for (var i = 0; i < files.length; i++){
        var url = await readAndResize(files[i], 900, 0.82);
        data.fotos.push(url);
      }
      renderFotosGrid();
      e.target.value = "";
    });
  }

  var tipoGrid = $("tipo-grid");
  if (tipoGrid){
    tipoGrid.querySelectorAll(".opt-btn").forEach(function(btn){
      btn.onclick = function(){
        var k = btn.dataset.tipo;
        if (!isPremium && k !== FLOR_GRATIS){ showPremium("tipo"); return; }
        data.tipoFlor = k;
        tipoGrid.querySelectorAll(".opt-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
      };
    });
  }
  var intensGrid = $("intens-grid");
  if (intensGrid){
    intensGrid.querySelectorAll(".opt-btn").forEach(function(btn){
      btn.onclick = function(){
        var k = btn.dataset.intens;
        if (!isPremium && k !== INTENSIDAD_GRATIS){ showPremium("intensidad"); return; }
        data.intensidad = k;
        intensGrid.querySelectorAll(".opt-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
      };
    });
  }
  var paletasGrid = $("paletas-grid");
  if (paletasGrid){
    paletasGrid.querySelectorAll(".paleta-btn").forEach(function(btn){
      btn.onclick = function(){
        var k = btn.dataset.paleta;
        if (!isPremium && k !== PALETA_GRATIS){ showPremium("paleta"); return; }
        data.paleta = k;
        paletasGrid.querySelectorAll(".paleta-btn").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
      };
    });
  }

  var cancionPremBtn = $("cancion-premium-btn"); if (cancionPremBtn) cancionPremBtn.onclick = function(){ showPremium("cancion"); };

  var inCancion = $("in-cancion");
  if (inCancion){
    inCancion.addEventListener("change", function(e){
      var f = e.target.files[0];
      if (!f) return;
      if (!f.type.startsWith("audio/")){ showStatus("Solo archivos de audio", false); return; }
      if (f.size > 5 * 1024 * 1024){ showStatus("Máximo 5 MB de audio", false); return; }
      var rd = new FileReader();
      rd.onload = function(ev){
        data.cancion = ev.target.result;
        $("cancion-label").textContent = "✓ " + f.name;
      };
      rd.readAsDataURL(f);
    });
  }
}

function guardarPaso(){
  if (pasoActual === 0){
    var p = $("in-para"); if (p) data.para = p.value.trim() || "Mi persona favorita";
    var m = $("in-mensaje"); if (m) data.mensaje = m.value.trim() || data.mensaje;
    var f = $("in-firma"); if (f) data.firma = f.value.trim() || data.firma;
  }
  else if (pasoActual === 3){
    var d = $("in-de"); if (d) data.de = d.value.trim() || "Con amor";
  }
}

function vistaPrevia(){
  guardarPaso();
  showLoading(true, "Preparando vista previa...");
  setTimeout(function(){
    try {
      var html = buildRegaloHTML();
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var w = window.open(url, "_blank");
      if (!w) showStatus("Permite ventanas emergentes", false);
      else showStatus("¡Vista previa abierta! ✓");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    } catch(err){
      console.error(err);
      showStatus("Error: " + err.message, false);
    } finally { showLoading(false); }
  }, 100);
}

function descargar(){
  guardarPaso();
  showLoading(true, "Empaquetando tu regalo...");
  setTimeout(function(){
    try {
      var html = buildRegaloHTML();
      var sizeKB = (html.length / 1024).toFixed(1);
      var blob = new Blob([html], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var fname = "flores-para-" + (data.para || "ti").replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".html";
      a.href = url;
      a.download = fname;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
      showStatus("¡Descargado! (" + sizeKB + " KB) 📥");
    } catch(err){
      console.error(err);
      showStatus("Error: " + err.message, false);
    } finally { showLoading(false); }
  }, 100);
}

function compartirWhatsApp(){
  guardarPaso();
  var texto = "🌼 Te regalé flores amarillas virtuales 💛\n" +
              "Son solo para ti: " + data.para + "\n\n" +
              "Te las mando por aquí:";
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}

  $("btn-vista").addEventListener("click", vistaPrevia);
  $("btn-descarga").addEventListener("click", descargar);
