        positions[i * 3 + 1] = p.y;
        positions[i * 3 + 2] = p.z;

        const tx = THREE.MathUtils.clamp(p.x + 0.5, 0, 1);
        const ty = THREE.MathUtils.clamp(-p.y + 0.5, 0, 1);
        const hue = (tx * 0.72 + ty * 0.18 + Math.random() * 0.14) % 1;
        const color = new THREE.Color().setHSL(hue, 1.0, 0.68);

        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;

        sizes[i] = 1.0;
        activations[i] = 0;
        randoms[i] = Math.random();
        namePhases[i] = Math.random() * Math.PI * 2;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
      geometry.setAttribute('activation', new THREE.BufferAttribute(activations, 1));
      geometry.setAttribute('aRandom', new THREE.BufferAttribute(randoms, 1));

      namePosAttr = geometry.attributes.position;
      nameColorAttr = geometry.attributes.aColor;
      nameSizeAttr = geometry.attributes.aSize;
      nameActivationAttr = geometry.attributes.activation;

      namePoints = new THREE.Points(geometry, nameMaterial);
      namePoints.frustumCulled = false;
      nameGroup.add(namePoints);

      const order = new Array(nameCount);
      for (let i = 0; i < nameCount; i++) order[i] = i;
      order.sort((a, b) => nameBasePos[a].x - nameBasePos[b].x);
      nameSortedByX = order;

      sweepBurstEvery = Math.max(1, Math.floor(nameCount / 45));

      buildNeighbors();
      layout();
    }

    function updateScaleFactor() {
      const pixelRatio = renderer.getPixelRatio();
      nameMaterial.uniforms.scaleFactor.value =
        (window.innerHeight * pixelRatio) /
        (2 * Math.tan(camera.fov * Math.PI / 360));
    }

    function layout() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      composer.setSize(width, height);

      const vFov = (camera.fov * Math.PI) / 180;
      const visH = 2 * Math.tan(vFov / 2) * REF_DISTANCE;
      const visW = visH * camera.aspect;

      const sx = (visW * 0.92) / textBounds.w;
      const sy = (visH * 0.74) / Math.max(0.05, textBounds.h);
      fitScale = Math.min(sx, sy);
      if (!isFinite(fitScale) || fitScale <= 0) fitScale = 20;

      const radius = Math.max(0.032, spacing * fitScale * 0.34);

      if (nameSizeAttr) {
        const sizes = nameSizeAttr.array;
        const diameter = radius * 2;
        for (let i = 0; i < nameCount; i++) sizes[i] = diameter;
        nameSizeAttr.needsUpdate = true;
      }

      raycaster.params.Points.threshold = radius * 2.2;

      updateScaleFactor();
    }

    const particleBursts = [];

    function createParticles(worldPosition, color) {
      const particleCount = 40;
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const colors = [];
      const velocities = [];

      for (let i = 0; i < particleCount; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.random() * Math.PI;
        const r = 0.2 + Math.random() * 0.3;

        positions.push(
          r * Math.sin(phi) * Math.cos(theta),
          r * Math.sin(phi) * Math.sin(theta),
          r * Math.cos(phi)
        );

        const pc = color.clone();
        pc.offsetHSL(Math.random() * 0.1 - 0.05, 0, Math.random() * 0.2);
        colors.push(pc.r, pc.g, pc.b);

        velocities.push(
          (Math.random() - 0.5) * 0.16,
          (Math.random() - 0.5) * 0.16,
          (Math.random() - 0.5) * 0.16
        );
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.22,
        vertexColors: true,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const points = new THREE.Points(geometry, material);
      points.position.copy(worldPosition);
      scene.add(points);

      particleBursts.push({
        points, geometry, material, velocities,
        startTime: performance.now() * 0.001
      });
    }

    function updateAllBursts(time) {
      for (let i = particleBursts.length - 1; i >= 0; i--) {
        const b = particleBursts[i];
        const elapsed = time - b.startTime;

        if (elapsed > 1.3) {
          scene.remove(b.points);
          b.geometry.dispose();
          b.material.dispose();
          particleBursts.splice(i, 1);
          continue;
        }

        const pos = b.geometry.attributes.position.array;
        const vel = b.velocities;

        for (let j = 0; j < pos.length; j += 3) {
          pos[j] += vel[j] * (1 + elapsed);
          pos[j + 1] += vel[j + 1] * (1 + elapsed) + 0.01;
          pos[j + 2] += vel[j + 2] * (1 + elapsed);
        }

        b.geometry.attributes.position.needsUpdate = true;
        b.material.opacity = 0.9 * (1 - elapsed / 1.3);
      }
    }

    function activateParticleBurst(index, time, generation) {
      if (generation !== chainGeneration) return;
      if (index < 0 || index >= nameCount) return;
      if (nameActivated[index]) return;
      nameActivated[index] = 1;
      nameActivationTime[index] = time;

      const bp = nameBasePos[index];
      const worldPos = new THREE.Vector3(
        bp.x * fitScale, bp.y * fitScale, bp.z * fitScale
      );
      nameGroup.localToWorld(worldPos);

      const cArr = nameColorAttr.array;
      const color = new THREE.Color(cArr[index * 3], cArr[index * 3 + 1], cArr[index * 3 + 2]);
      createParticles(worldPos, color);

      const neighbors = nameNeighbors[index];
      if (!neighbors) return;
      for (let i = 0; i < neighbors.length; i++) {
        const nIdx = neighbors[i];
        const delay = 55 + Math.random() * 70;
        setTimeout(() => {
          activateParticleBurst(nIdx, time + 0.1 * (i + 1), generation);
        }, delay);
      }
    }

    function startChainReaction() {
      if (nameCount === 0) return;
      nameActivated = new Uint8Array(nameCount);
      nameActivationTime = new Array(nameCount).fill(-1);
      sweepIndex = 0;
      sweepBurstCounter = 0;
      sweepStartTime = performance.now() * 0.001;
      sweepActive = true;
    }

    document.getElementById('chainReaction').addEventListener('click', startChainReaction);

    const nameInput = document.getElementById('nameInput');
    const applyNameBtn = document.getElementById('applyName');

    function readHashName() {
      const hash = window.location.hash || '';
      const m = hash.match(/[#&]name=([^&]+)/);
      if (m) {
        try { return decodeURIComponent(m[1].replace(/\+/g, ' ')); } catch (e) { return m[1]; }
      }
      return null;
    }

    (function initName() {
      const h = readHashName();
      if (h) {
        nameInput.value = h;
        try {
          if (history.replaceState) {
            history.replaceState(null, '', window.location.pathname + window.location.search + '#name=' + encodeURIComponent(h));
          }
        } catch (e) {}
      }
    })();

    function applyName() {
      buildName(nameInput.value);
      if (window.__fallbackBuildName) window.__fallbackBuildName(nameInput.value);
    }

    applyNameBtn.addEventListener('click', applyName);
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        nameInput.blur();
        applyName();
      }
    });

    /* =========================================================
       COMPARTIR POR WHATSAPP · con el nombre en el hash
    ========================================================= */
    const waShareBtn = document.getElementById('waShare');

    function buildShareURL(name) {
      try {
        const u = new URL(window.location.href);
        u.hash = '#name=' + encodeURIComponent(name);
        return u.toString();
      } catch (e) {
        const base = window.location.href.split('#')[0];
        return base + '#name=' + encodeURIComponent(name);
      }
    }

    waShareBtn.addEventListener('click', async (ev) => {
      ev.preventDefault();
      const name = (nameInput.value || 'HOLA').trim() || 'HOLA';
      const shareURL = buildShareURL(name);

      const shareText = '✨ Mira la frase mágica que creé con Dedicatorias Mágicas ✨\n' +
                        '👀 Ábrelo aquí: ' + shareURL;

      // Intento nativo en móvil (solo texto, sin archivo adjunto)
      if (navigator.share && /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
        try {
          await navigator.share({
            title: 'Mi frase mágica',
            text: shareText
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      // Fallback universal: WhatsApp Web
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
    });

    /* =========================================================
       ESTRELLAS FUGACES
    ========================================================= */
    const SHOOTING_STAR_COUNT = 4;
    const shootingStars = [];
    const starBounds = { x: 70, y: 45, z: 60 };

    function createShootingStar(segments = 34) {
      const positions = new Float32Array(segments * 3);
      const colors = new Float32Array(segments * 3);

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        color: new THREE.Color(1.8, 1.8, 1.8)
      });

      const line = new THREE.Line(geometry, material);
      line.frustumCulled = false;
      scene.add(line);

      const headGeo = new THREE.BufferGeometry();
      headGeo.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0], 3));
      const headMat = new THREE.PointsMaterial({
        size: 0.6,
        color: new THREE.Color(2.5, 2.5, 2.5),
        transparent: true,
        opacity: 1.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        fog: false,
        sizeAttenuation: true
      });
      const headPoint = new THREE.Points(headGeo, headMat);
      headPoint.frustumCulled = false;
      scene.add(headPoint);

      const star = {
        line, geometry, positions, colors, segments,
        headPoint, headMat,
        head: new THREE.Vector3(),
        dir: new THREE.Vector3(1, 0, 0),
        speed: 25, tailLength: 6,
        color: new THREE.Color(0.8, 0.9, 1.0),
        curve: 0.3, life: 0
      };

      respawnStar(star);
      return star;
    }

    function respawnStar(star) {
      const fromLeft = Math.random() < 0.5;
      const y = (Math.random() - 0.5) * 34;
      const z = (Math.random() - 0.5) * 44 - 8;

      star.head.set(fromLeft ? -starBounds.x : starBounds.x, y, z);

      const dirX = fromLeft ? 1 : -1;
      const dirY = (Math.random() - 0.5) * 0.35;
      const dirZ = (Math.random() - 0.5) * 0.28;
      star.dir.set(dirX, dirY, dirZ).normalize();

      star.speed = 18 + Math.random() * 14;
      star.tailLength = 7 + Math.random() * 6;
      star.curve = (Math.random() - 0.5) * 0.6;

      const pick = Math.random();
      if (pick < 0.6) {
        star.color.setHSL(0.58 + Math.random() * 0.08, 0.85, 0.85);
      } else if (pick < 0.85) {
        star.color.setHSL(0.12 + Math.random() * 0.06, 0.95, 0.82);
      } else {
        star.color.setHSL(0.88 + Math.random() * 0.08, 0.9, 0.85);
      }

      const headColor = star.color.clone().offsetHSL(0, -0.2, 0.15);
      star.headMat.color.setRGB(
        headColor.r * 2.6,
        headColor.g * 2.6,
        headColor.b * 2.6
      );

      rebuildTail(star);
      star.life = 0;
    }

    function rebuildTail(star) {
      const { dir, tailLength, positions, colors, segments, color, curve } = star;
      const perp = new THREE.Vector3(-dir.y, dir.x, dir.z * 0.5).normalize();

      for (let i = 0; i < segments; i++) {
        const t = i / (segments - 1);
        const offset = t * tailLength;

        positions[i * 3]     = -dir.x * offset + perp.x * Math.sin(t * Math.PI) * curve;
        positions[i * 3 + 1] = -dir.y * offset + perp.y * Math.sin(t * Math.PI) * curve;
        positions[i * 3 + 2] = -dir.z * offset + perp.z * Math.sin(t * Math.PI) * curve;

        const fade = Math.pow(1.0 - t, 1.7);
        colors[i * 3]     = color.r * fade;
        colors[i * 3 + 1] = color.g * fade;
        colors[i * 3 + 2] = color.b * fade;
      }

      star.geometry.attributes.position.needsUpdate = true;
      star.geometry.attributes.color.needsUpdate = true;
    }

    function updateShootingStars(delta) {
      for (let s = 0; s < shootingStars.length; s++) {
        const star = shootingStars[s];
        star.life += delta;

        star.head.addScaledVector(star.dir, star.speed * delta);
        star.line.position.copy(star.head);
        star.headPoint.position.copy(star.head);

        if (Math.abs(star.head.x) > starBounds.x + 4 ||
            Math.abs(star.head.y) > starBounds.y + 4 ||
            Math.abs(star.head.z) > starBounds.z + 4) {
          respawnStar(star);
        }
      }
    }

    for (let i = 0; i < SHOOTING_STAR_COUNT; i++) {
      const star = createShootingStar();
      const advance = Math.random() * 10;
      star.head.addScaledVector(star.dir, star.speed * advance);
      star.line.position.copy(star.head);
      star.headPoint.position.copy(star.head);
      shootingStars.push(star);
    }

    let lastTime = 0;

    function animate(currentTime) {
      requestAnimationFrame(animate);

      const time = currentTime * 0.001;
      const delta = Math.min(time - lastTime, 0.1);
      lastTime = time;

      if (sweepActive && nameCount > 0) {
        const elapsed = time - sweepStartTime;
        const t = Math.min(1, elapsed / SWEEP_DURATION);
        const target = Math.floor(t * nameCount);

        while (sweepIndex < target) {
          const idx = nameSortedByX[sweepIndex];

          nameActivated[idx] = 1;
          nameActivationTime[idx] = time;

          if (sweepBurstCounter % sweepBurstEvery === 0) {
            const bp = nameBasePos[idx];
            const worldPos = new THREE.Vector3(
              bp.x * fitScale, bp.y * fitScale, bp.z * fitScale
            );
            nameGroup.localToWorld(worldPos);

            const cArr = nameColorAttr.array;
            const color = new THREE.Color(
              cArr[idx * 3], cArr[idx * 3 + 1], cArr[idx * 3 + 2]
            );
            createParticles(worldPos, color);
          }
          sweepBurstCounter++;
          sweepIndex++;
        }

        if (sweepIndex >= nameCount) sweepActive = false;
      }

      if (namePoints) {
        const positions = namePosAttr.array;
        const activations = nameActivationAttr.array;
        const amp = fitScale * 0.006;

        for (let i = 0; i < nameCount; i++) {
          const bp = nameBasePos[i];
          const ph = namePhases[i];
          positions[i * 3]     = bp.x * fitScale + Math.sin(time * 0.9 + ph) * amp;
          positions[i * 3 + 1] = bp.y * fitScale + Math.cos(time * 1.1 + ph) * amp;
          positions[i * 3 + 2] = bp.z * fitScale + Math.sin(time * 1.3 + ph) * amp;

          const at = nameActivationTime[i];
          if (at >= 0) {
            const e = time - at;
            const strength = Math.max(0, 1 - e / 1.2);
            activations[i] = strength;
            if (strength <= 0) nameActivationTime[i] = -1;
          } else if (activations[i] !== 0) {
            activations[i] = 0;
          }
        }

        namePosAttr.needsUpdate = true;
        nameActivationAttr.needsUpdate = true;
        nameMaterial.uniforms.time.value = time;
      }

      nameGroup.rotation.y = Math.sin(time * 0.35) * 0.16;
      nameGroup.rotation.x = Math.sin(time * 0.27) * 0.07;

      vignettePass.uniforms.time.value = time;

      updateAllBursts(time);
      updateShootingStars(delta);

      if (atmosphere.geometry.attributes.position) {
        const positions = atmosphere.geometry.attributes.position.array;
        const speeds = atmosphere.userData.speeds;

        for (let i = 0; i < positions.length; i += 3) {
          const x = positions[i];
          const z = positions[i + 2];
          const speed = speeds[i / 3] * delta;

          positions[i]     = x * Math.cos(speed) - z * Math.sin(speed);
          positions[i + 2] = x * Math.sin(speed) + z * Math.cos(speed);
          positions[i + 1] += Math.sin(time * 0.5 + i * 0.01) * 0.01;
        }
        atmosphere.geometry.attributes.position.needsUpdate = true;
      }

      blueLight.position.x = 15 * Math.cos(time * 0.2);
      blueLight.position.z = 15 * Math.sin(time * 0.2);

      atmosphere.rotation.y += 0.001;

      controls.update();
      composer.render();
    }

    window.addEventListener('resize', () => layout());
    window.addEventListener('orientationchange', () => setTimeout(layout, 250));

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let pointerDownPos = { x: 0, y: 0 };

    renderer.domElement.addEventListener('pointerdown', (e) => {
      pointerDownPos = { x: e.clientX, y: e.clientY };
    });

    renderer.domElement.addEventListener('pointerup', (e) => {
      const dx = e.clientX - pointerDownPos.x;
      const dy = e.clientY - pointerDownPos.y;
      if (Math.hypot(dx, dy) > 12) return;
      if (!namePoints) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObject(namePoints, false);

      if (intersects.length > 0) {
        const idx = intersects[0].index;
        activateParticleBurst(idx, performance.now() * 0.001, chainGeneration);
      }
    });

    buildName(nameInput.value);
    animate(0);

    window.__threeReady = true;
    if (window.__hideFallback2D) window.__hideFallback2D();
    if (window.__fallbackBuildName) window.__fallbackBuildName(nameInput.value);
  </script>

</body>
