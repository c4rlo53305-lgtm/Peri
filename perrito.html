'function generateNetwork(f=1.0){\n' +
'  const nodes = [];\n' +
'  const root = new Node(new THREE.Vector3(0,0,0), 0, 0);\n' +
'  root.size = 2.2; nodes.push(root);\n' +
'  const layers = 5;\n' +
'  const GR = (1+Math.sqrt(5))/2;\n' +
'  for(let L=1; L<=layers; L++){\n' +
'    const radius = L*4;\n' +
'    const N = Math.floor(L*12*f);\n' +
'    for(let i=0;i<N;i++){\n' +
'      const phi = Math.acos(1 - 2*(i+0.5)/N);\n' +
'      const theta = 2*Math.PI*i/GR;\n' +
'      const pos = new THREE.Vector3(radius*Math.sin(phi)*Math.cos(theta), radius*Math.sin(phi)*Math.sin(theta), radius*Math.cos(phi));\n' +
'      const isLeaf = L===layers || Math.random()<0.3;\n' +
'      const n = new Node(pos, L, isLeaf?1:0);\n' +
'      n.distanceFromRoot = radius;\n' +
'      nodes.push(n);\n' +
'      if(L > 1){\n' +
'        const prev = nodes.filter(x => x.level===L-1 && x!==root);\n' +
'        prev.sort((a,b)=> pos.distanceTo(a.position)-pos.distanceTo(b.position));\n' +
'        for(let j=0;j<Math.min(3, prev.length);j++){\n' +

'  }\n' +
'  return { nodes, root };\n' +

'  const maxW2 = 24, maxH2 = 12;\n' +
'  let WORLD_W, WORLD_H;\n' +
'  if(aspect > maxW2/maxH2){ WORLD_W = maxW2; WORLD_H = maxW2/aspect; }\n' +
'  else { WORLD_H = maxH2; WORLD_W = maxH2*aspect; }\n' +
'  phraseBounds.w = WORLD_W;\n' +
'  phraseBounds.h = WORLD_H;\n' +
'  for(let i=pts.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = pts[i]; pts[i]=pts[j]; pts[j]=t; }\n' +
'  return pts.map(p => ({ x: ((p.x - cxPx)/tW) * WORLD_W, y: -((p.y - cyPx)/tH) * WORLD_H, z: 0 }));\n' +
'}\n' +
'\n' +
'function buildFillerParticles(){\n' +
'  const count = isPremium ? 25000 : 10000;\n' +
'  const positions = new Float32Array(count*3);\n' +
'  const targets = new Float32Array(count*3);\n' +
'  const colors = new Float32Array(count*3);\n' +
'  const randoms = new Float32Array(count*3);\n' +
'  const actives = new Float32Array(count);\n' +
'  for(let i=0;i<count;i++){\n' +
'    const r = 6 + Math.random()*22;\n' +
'    const theta = Math.random()*Math.PI*2;\n' +
'    const phi = Math.acos(2*Math.random()-1);\n' +
'    positions[i*3] = r*Math.sin(phi)*Math.cos(theta);\n' +
'    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta) + 2;\n' +
'    positions[i*3+2] = r*Math.cos(phi);\n' +
'    targets[i*3] = positions[i*3]; targets[i*3+1] = positions[i*3+1]; targets[i*3+2] = positions[i*3+2];\n' +
'    const c = palColors[Math.floor(Math.random()*palColors.length)];\n' +
'    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;\n' +
'    randoms[i*3] = Math.random(); randoms[i*3+1] = Math.random(); randoms[i*3+2] = Math.random();\n' +
'    actives[i] = 1.0;\n' +
'  }\n' +
'  const geom = new THREE.BufferGeometry();\n' +
'  geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));\n' +
'  geom.setAttribute("targetPosition", new THREE.Float32BufferAttribute(targets, 3));\n' +
'  geom.setAttribute("aColor", new THREE.Float32BufferAttribute(colors, 3));\n' +
'  geom.setAttribute("aRand", new THREE.Float32BufferAttribute(randoms, 3));\n' +
'  geom.setAttribute("aActive", new THREE.Float32BufferAttribute(actives, 1));\n' +
'  const mat = new THREE.ShaderMaterial({\n' +
'    uniforms: { uTime: { value: 0 }, uMorph: { value: 0 } },\n' +
'    vertexShader: FILLER_VS, fragmentShader: FILLER_FS,\n' +
'    transparent: true, depthWrite: false, depthTest: false, blending: THREE.NormalBlending\n' +
'  });\n' +
'  fillerMesh = new THREE.Points(geom, mat);\n' +
'  scene.add(fillerMesh);\n' +
'}\n' +
'\n' +
'function buildSparkles(){\n' +
'  const count = isPremium ? 2200 : 800;\n' +
'  const positions = new Float32Array(count*3);\n' +
'  const aPositions = new Float32Array(count*3);\n' +
'  const colors = new Float32Array(count*3);\n' +
'  const randoms = new Float32Array(count*3);\n' +
'  const sizes = new Float32Array(count);\n' +
'  for(let i=0;i<count;i++){\n' +
'    positions[i*3] = (Math.random()-0.5)*100;\n' +
'    positions[i*3+1] = (Math.random()-0.5)*100;\n' +
'    positions[i*3+2] = (Math.random()-0.5)*100;\n' +
'    aPositions[i*3] = (Math.random()-0.5)*40;\n' +
'    aPositions[i*3+1] = (Math.random()-0.5)*25;\n' +
'    aPositions[i*3+2] = (Math.random()-0.5)*8;\n' +
'    const c = palColors[Math.floor(Math.random()*palColors.length)].clone();\n' +
'    c.lerp(new THREE.Color(1,1,1), Math.random()*0.4);\n' +
'    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;\n' +
'    randoms[i*3] = Math.random(); randoms[i*3+1] = Math.random(); randoms[i*3+2] = Math.random();\n' +
'    const r = Math.random();\n' +
'    sizes[i] = r < 0.85 ? (0.6 + Math.random()*0.9) : (1.6 + Math.random()*1.4);\n' +
'  }\n' +
'  const geom = new THREE.BufferGeometry();\n' +
'  geom.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));\n' +
'  geom.setAttribute("aPos", new THREE.Float32BufferAttribute(aPositions, 3));\n' +
'  geom.setAttribute("aColor", new THREE.Float32BufferAttribute(colors, 3));\n' +
'  geom.setAttribute("aRand", new THREE.Float32BufferAttribute(randoms, 3));\n' +
'  geom.setAttribute("aSize", new THREE.Float32BufferAttribute(sizes, 1));\n' +
'  const mat = new THREE.ShaderMaterial({\n' +
'    uniforms: { uTime: { value: 0 }, uMorph: { value: 0 } },\n' +
'    vertexShader: SPARKLE_VS, fragmentShader: SPARKLE_FS,\n' +
'    transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending\n' +
'  });\n' +
'  sparkleMesh = new THREE.Points(geom, mat);\n' +
'  scene.add(sparkleMesh);\n' +
'}\n' +
'\n' +
'function buildVisualization(){\n' +
'  if(nodesMesh){ scene.remove(nodesMesh); nodesMesh.geometry.dispose(); nodesMesh.material.dispose(); }\n' +
'  if(connectionsMesh){ scene.remove(connectionsMesh); connectionsMesh.geometry.dispose(); connectionsMesh.material.dispose(); }\n' +
'  if(fillerMesh){ scene.remove(fillerMesh); fillerMesh.geometry.dispose(); fillerMesh.material.dispose(); }\n' +
'  if(sparkleMesh){ scene.remove(sparkleMesh); sparkleMesh.geometry.dispose(); sparkleMesh.material.dispose(); }\n' +
'  const { nodes } = generateNetwork(1.0);\n' +
'  const nPos=[], nTypes=[], nSizes=[], nColors=[], nDist=[], nTarget=[];\n' +
'  nodes.forEach((n) => {\n' +
'    nPos.push(n.position.x, n.position.y, n.position.z);\n' +
'    nTypes.push(n.type); nSizes.push(n.size); nDist.push(n.distanceFromRoot);\n' +
'    const ci = Math.min(n.level, palColors.length-1);\n' +
'    const c = palColors[ci].clone();\n' +
'    c.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));\n' +
'    nColors.push(c.r, c.g, c.b);\n' +
'    nTarget.push(n.position.x, n.position.y, n.position.z);\n' +
'  });\n' +
'  const nodeGeom = new THREE.BufferGeometry();\n' +
'  nodeGeom.setAttribute("position", new THREE.Float32BufferAttribute(nPos, 3));\n' +
'  nodeGeom.setAttribute("nodeType", new THREE.Float32BufferAttribute(nTypes, 1));\n' +
'  nodeGeom.setAttribute("nodeSize", new THREE.Float32BufferAttribute(nSizes, 1));\n' +
'  nodeGeom.setAttribute("nodeColor", new THREE.Float32BufferAttribute(nColors, 3));\n' +
'  nodeGeom.setAttribute("distanceFromRoot", new THREE.Float32BufferAttribute(nDist, 1));\n' +
'  nodeGeom.setAttribute("targetPosition", new THREE.Float32BufferAttribute(nTarget, 3));\n' +
'  nodesMesh = new THREE.Points(nodeGeom, new THREE.ShaderMaterial({\n' +
'    uniforms: THREE.UniformsUtils.clone(pulseUniforms),\n' +
'    vertexShader: NODE_VS, fragmentShader: NODE_FS,\n' +
'    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending\n' +
'  }));\n' +
'  scene.add(nodesMesh);\n' +
'  const cPos=[], cCol=[], cStr=[], cStart=[], cEnd=[], cPath=[];\n' +
'  const processed = new Set();\n' +
'  let pid = 0;\n' +
'  nodes.forEach((n, ni) => {\n' +
'    n.connections.forEach(c => {\n' +
'      const ci = nodes.indexOf(c.node);\n' +
'      if(ci === -1) return;\n' +
'      const key = [Math.min(ni,ci), Math.max(ni,ci)].join("-");\n' +
'      if(processed.has(key)) return;\n' +
'      processed.add(key);\n' +
'      for(let i=0;i<20;i++){\n' +
'        const t = i/19;\n' +
'        cPos.push(t,0,0);\n' +
'        cStart.push(n.position.x, n.position.y, n.position.z);\n' +
'        cEnd.push(c.node.position.x, c.node.position.y, c.node.position.z);\n' +
'        cPath.push(pid); cStr.push(c.strength);\n' +
'        const avgLvl = Math.min(Math.floor((n.level + c.node.level)/2), palColors.length-1);\n' +
'        const cc = palColors[avgLvl].clone();\n' +
'        cc.offsetHSL(THREE.MathUtils.randFloatSpread(0.03), THREE.MathUtils.randFloatSpread(0.08), THREE.MathUtils.randFloatSpread(0.08));\n' +
'        cCol.push(cc.r, cc.g, cc.b);\n' +
'      }\n' +
'      pid++;\n' +
'    });\n' +
'  });\n' +
'  const connGeom = new THREE.BufferGeometry();\n' +
'  connGeom.setAttribute("position", new THREE.Float32BufferAttribute(cPos, 3));\n' +
'  connGeom.setAttribute("startPoint", new THREE.Float32BufferAttribute(cStart, 3));\n' +
'  connGeom.setAttribute("endPoint", new THREE.Float32BufferAttribute(cEnd, 3));\n' +
'  connGeom.setAttribute("connectionStrength", new THREE.Float32BufferAttribute(cStr, 1));\n' +
'  connGeom.setAttribute("connectionColor", new THREE.Float32BufferAttribute(cCol, 3));\n' +
'  connGeom.setAttribute("pathIndex", new THREE.Float32BufferAttribute(cPath, 1));\n' +
'  connectionsMesh = new THREE.LineSegments(connGeom, new THREE.ShaderMaterial({\n' +
'    uniforms: THREE.UniformsUtils.clone(pulseUniforms),\n' +
'    vertexShader: CONN_VS, fragmentShader: CONN_FS,\n' +
'    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending\n' +
'  }));\n' +
'  scene.add(connectionsMesh);\n' +
'  palColors.slice(0,3).forEach((color, i) => {\n' +
'    nodesMesh.material.uniforms.uPulseColors.value[i].copy(color);\n' +
'    connectionsMesh.material.uniforms.uPulseColors.value[i].copy(color);\n' +
'  });\n' +
'  buildFillerParticles();\n' +
'  buildSparkles();\n' +
'  updatePhraseTargets(CONFIG.phrases[0]);\n' +
'}\n' +
'\n' +
'function updatePhraseTargets(phrase){\n' +
'  const pts = bakePhrase(phrase);\n' +
'  const total = pts.length;\n' +
'  if(!total) return;\n' +
'  if(nodesMesh){\n' +
'    const a = nodesMesh.geometry.attributes.targetPosition;\n' +
'    const arr = a.array;\n' +
'    for(let i=0;i<a.count;i++){\n' +
'      const p = pts[i%total];\n' +
'      arr[i*3] = p.x + (Math.random()-0.5)*0.05;\n' +
'      arr[i*3+1] = p.y + (Math.random()-0.5)*0.05;\n' +
'      arr[i*3+2] = (Math.random()-0.5)*0.12;\n' +
'    }\n' +
'    a.needsUpdate = true;\n' +
'  }\n' +
'  if(fillerMesh){\n' +
'    const a = fillerMesh.geometry.attributes.targetPosition;\n' +
'    const act = fillerMesh.geometry.attributes.aActive;\n' +
'    const arr = a.array, actArr = act.array;\n' +
'    const toP = Math.min(9000, Math.floor(a.count * 0.40));\n' +
'    for(let i=0;i<a.count;i++){\n' +
'      if(i < toP){\n' +
'        const p = pts[i%total];\n' +
'        arr[i*3] = p.x + (Math.random()-0.5)*0.05;\n' +
'        arr[i*3+1] = p.y + (Math.random()-0.5)*0.05;\n' +
'        arr[i*3+2] = (Math.random()-0.5)*0.12;\n' +
'        actArr[i] = 1.0;\n' +
'      } else {\n' +
'        arr[i*3] = (Math.random()-0.5)*100;\n' +
'        arr[i*3+1] = (Math.random()-0.5)*100;\n' +
'        arr[i*3+2] = (Math.random()-0.5)*60;\n' +
'        actArr[i] = 0.0;\n' +
'      }\n' +
'    }\n' +
'    a.needsUpdate = true; act.needsUpdate = true;\n' +
'  }\n' +
'  if(sparkleMesh){\n' +
'    const a = sparkleMesh.geometry.attributes.aPos;\n' +
'    const arr = a.array;\n' +
'    for(let i=0;i<a.count;i++){\n' +
'      arr[i*3] = (Math.random()-0.5) * (phraseBounds.w * 2);\n' +
'      arr[i*3+1] = (Math.random()-0.5) * (phraseBounds.h * 2);\n' +
'      arr[i*3+2] = (Math.random()-0.5)*6;\n' +
'    }\n' +
'    a.needsUpdate = true;\n' +
'  }\n' +
'}\n' +
'\n' +
'let phraseIdx = 0;\n' +
'let morphValue = 0;\n' +
'let morphStart = 0;\n' +
'let currentState = "network";\n' +
'let started = false;\n' +
'const frontCamPos = new THREE.Vector3(0, 0, 40);\n' +
'const originTarget = new THREE.Vector3(0, 0, 0);\n' +
'const clock = new THREE.Clock();\n' +
'\n' +
'const raycaster = new THREE.Raycaster();\n' +
'const pointer = new THREE.Vector2();\n' +
'const interactionPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);\n' +
'const interactionPoint = new THREE.Vector3();\n' +
'let lastPulseIdx = 0;\n' +
'\n' +
'function triggerPulse(cx, cy){\n' +
'  pointer.x = (cx / window.innerWidth) * 2 - 1;\n' +
'  pointer.y = -(cy / window.innerHeight) * 2 + 1;\n' +
'  raycaster.setFromCamera(pointer, camera);\n' +
'  interactionPlane.normal.copy(camera.position).normalize();\n' +
'  interactionPlane.constant = -interactionPlane.normal.dot(camera.position) + camera.position.length()*0.5;\n' +
'  if(raycaster.ray.intersectPlane(interactionPlane, interactionPoint)){\n' +
'    const t = clock.getElapsedTime();\n' +
'    if(nodesMesh && connectionsMesh){\n' +
'      lastPulseIdx = (lastPulseIdx + 1) % 3;\n' +
'      nodesMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);\n' +
'      nodesMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = t;\n' +
'      connectionsMesh.material.uniforms.uPulsePositions.value[lastPulseIdx].copy(interactionPoint);\n' +
'      connectionsMesh.material.uniforms.uPulseTimes.value[lastPulseIdx] = t;\n' +
'      const rc = palColors[Math.floor(Math.random()*palColors.length)];\n' +
'      nodesMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(rc);\n' +
'      connectionsMesh.material.uniforms.uPulseColors.value[lastPulseIdx].copy(rc);\n' +
'    }\n' +
'  }\n' +
'}\n' +
'\n' +
'function computeNeededDistance(){\n' +
'  const fovRad = camera.fov * Math.PI / 180;\n' +
'  const aspect = Math.max(0.35, camera.aspect);\n' +
'  const viewH = 2 * Math.tan(fovRad / 2);\n' +
'  const dH = (phraseBounds.h * 1.25) / viewH;\n' +
'  const dW = (phraseBounds.w * 1.25) / (viewH * aspect);\n' +
'  return Math.max(dH, dW);\n' +
'}\n' +
'\n' +
'const magicBtn = document.getElementById("magic-btn");\n' +
'\n' +
'function triggerPhrase(){\n' +
'  if(currentState !== "network") return;\n' +
'  currentState = "toPhrase";\n' +
'  morphStart = clock.getElapsedTime();\n' +
'  phraseIdx = (phraseIdx + 1) % CONFIG.phrases.length;\n' +
'  updatePhraseTargets(CONFIG.phrases[phraseIdx]);\n' +
'  const needed = computeNeededDistance();\n' +
'  frontCamPos.set(0, 0, needed * 1.05);\n' +
'  controls.autoRotate = false;\n' +
'  magicBtn.classList.add("active");\n' +
'  magicBtn.querySelector(".mb-text").textContent = "Volver a la galaxia";\n' +
'  magicBtn.querySelector(".mb-icon").textContent = "🌻";\n' +
'}\n' +
'\n' +
'function releasePhrase(){\n' +
'  if(currentState !== "phrase" && currentState !== "toPhrase") return;\n' +
'  currentState = "toNetwork";\n' +
'  morphStart = clock.getElapsedTime();\n' +
'  controls.autoRotate = true;\n' +
'  magicBtn.classList.remove("active");\n' +
'  magicBtn.querySelector(".mb-text").textContent = "Haz click aquí y haz magia";\n' +
'  magicBtn.querySelector(".mb-icon").textContent = "🪄";\n' +
'}\n' +
'\n' +
'magicBtn.addEventListener("click", (e) => {\n' +
'  e.stopPropagation();\n' +
'  if(currentState === "network") triggerPhrase();\n' +
'  else releasePhrase();\n' +
'});\n' +
'\n' +
'function handleTap(cx, cy){\n' +
'  if(!started) return;\n' +
'  if(currentState === "phrase" || currentState === "toPhrase") triggerPulse(cx, cy);\n' +
'}\n' +
'window.addEventListener("click", (e) => {\n' +
'  if(!started) return;\n' +
'  if(e.target.closest("#music-btn") || e.target.closest("#music-panel") ||\n' +
'     e.target.closest(".controls") || e.target.closest(".watermark") ||\n' +
'     e.target.closest("#magic-btn") || e.target.closest("#premium-modal") ||\n' +
'     e.target.closest("#intro-overlay")) return;\n' +
'  handleTap(e.clientX, e.clientY);\n' +
'});\n' +
'window.addEventListener("touchstart", (e) => {\n' +
'  if(!started) return;\n' +
'  const t = e.touches[0]; if(!t) return;\n' +
'  const el = document.elementFromPoint(t.clientX, t.clientY);\n' +
'  if(el && (el.closest("#music-btn") || el.closest("#music-panel") || el.closest(".controls") ||\n' +
'            el.closest(".watermark") || el.closest("#magic-btn") || el.closest("#premium-modal") ||\n' +
'            el.closest("#intro-overlay"))) return;\n' +
'  handleTap(t.clientX, t.clientY);\n' +
'}, { passive: true });\n' +
'\n' +
'window.addEventListener("resize", () => {\n' +
'  camera.aspect = window.innerWidth / window.innerHeight;\n' +
'  camera.updateProjectionMatrix();\n' +
'  renderer.setSize(window.innerWidth, window.innerHeight);\n' +
'  composer.setSize(window.innerWidth, window.innerHeight);\n' +
'  bloomPass.resolution.set(window.innerWidth, window.innerHeight);\n' +
'});\n' +
'\n' +
'const introOverlay = document.getElementById("intro-overlay");\n' +
'const introBtn = document.getElementById("intro-btn");\n' +
'let zoomStartTime = 0;\n' +
'let zoomDone = false;\n' +
'introBtn.addEventListener("click", () => {\n' +
'  if(started) return;\n' +
'  started = true;\n' +
'  introOverlay.classList.add("zooming");\n' +
'  setTimeout(() => { introOverlay.classList.add("hidden"); magicBtn.classList.add("shown"); }, 1400);\n' +
'  audio.play().then(() => { mpPlay.textContent = "⏸︎"; musicBtn.classList.add("playing"); musicBtn.textContent = "🎶"; }).catch(() => {});\n' +
'});\n' +
'\n' +
'function animate(){\n' +
'  requestAnimationFrame(animate);\n' +
'  const t = clock.getElapsedTime();\n' +
'  if(started && !zoomDone){\n' +
'    if(zoomStartTime === 0) zoomStartTime = t;\n' +
'    const p = Math.min(1, (t - zoomStartTime) / 2.4);\n' +
'    const e = 1 - Math.pow(1 - p, 3);\n' +
'    camera.position.z = THREE.MathUtils.lerp(140, 28, e);\n' +
'    camera.position.y = THREE.MathUtils.lerp(10, 8, e);\n' +
'    if(p >= 1){ zoomDone = true; }\n' +
'  }\n' +
'  if(currentState === "toPhrase" || currentState === "toNetwork"){\n' +
'    const p = Math.min(1, (t - morphStart) / 1.6);\n' +
'    const e = p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p+2, 3)/2;\n' +
'    morphValue = currentState === "toPhrase" ? e : 1 - e;\n' +
'    if(p >= 1){\n' +
'      if(currentState === "toPhrase") currentState = "phrase";\n' +
'      else { currentState = "network"; morphValue = 0; }\n' +
'    }\n' +
'  }\n' +
'  if(currentState === "toPhrase"){\n' +
'    camera.position.lerp(frontCamPos, 0.08);\n' +
'    controls.target.lerp(originTarget, 0.12);\n' +
'  }\n' +
'  const targetBloom = BASE_BLOOM + (PHRASE_BLOOM - BASE_BLOOM) * morphValue;\n' +
'  bloomPass.strength += (targetBloom - bloomPass.strength) * 0.08;\n' +
'  if(nodesMesh){\n' +
'    nodesMesh.material.uniforms.uTime.value = t;\n' +
'    nodesMesh.material.uniforms.uMorph.value = morphValue;\n' +
'    nodesMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);\n' +
'  }\n' +
'  if(connectionsMesh){\n' +
'    connectionsMesh.material.uniforms.uTime.value = t;\n' +
'    connectionsMesh.material.uniforms.uMorph.value = morphValue;\n' +
'    connectionsMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);\n' +
'  }\n' +
'  if(fillerMesh){\n' +
'    fillerMesh.material.uniforms.uTime.value = t;\n' +
'    fillerMesh.material.uniforms.uMorph.value = morphValue;\n' +
'    fillerMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);\n' +
'  }\n' +
'  if(sparkleMesh){\n' +
'    sparkleMesh.material.uniforms.uTime.value = t;\n' +
'    sparkleMesh.material.uniforms.uMorph.value = morphValue;\n' +
'    sparkleMesh.rotation.y = Math.sin(t*0.04)*0.05*(1-morphValue);\n' +
'  }\n' +
'  sunflowerGroup.children.forEach(s => {\n' +
'    s.position.y = s.userData.baseY + Math.sin(t * s.userData.speed + s.userData.phase) * 1.2;\n' +
'  });\n' +
'  sunflowerGroup.rotation.y += 0.0008;\n' +
'  starField.rotation.y += 0.0002;\n' +
'  starField.material.uniforms.uTime.value = t;\n' +
'  controls.update();\n' +
'  composer.render();\n' +
'}\n' +
'\n' +
'buildVisualization();\n' +
'animate();\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';
}

// ============ VISUALIZAR / DESCARGAR ============
async function visualize(){
  readInputs();
  showLoading(true, "Preparando vista previa...");
  try {
    var html = await buildGalaxyHTML();
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var modal = $("preview-modal");
    var iframe = $("preview-frame");
    iframe.src = "about:blank";
    setTimeout(function(){
      iframe.src = url;
      modal.classList.add("show");
      showLoading(false);
    }, 60);
    if (_previewURL) URL.revokeObjectURL(_previewURL);
    _previewURL = url;
  } catch(err){
    console.error(err);
    showStatus("Error: " + err.message, false);
    showLoading(false);
  }
}
function closePreview(){
  var modal = $("preview-modal");
  var iframe = $("preview-frame");
  if (modal) modal.classList.remove("show");
  if (iframe) iframe.src = "about:blank";
  if (_previewURL){ URL.revokeObjectURL(_previewURL); _previewURL = null; }
}

async function download(){
  readInputs();
  showLoading(true, "Empaquetando tus flores...");
  try {
    var html = await buildGalaxyHTML();
    var sizeKB = (html.length / 1024).toFixed(1);
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var filename = "flores-amarillas-para-" + slugify(state.name) + ".html";
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a);
    var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      var w = window.open(url, "_blank");
      if (!w) { var modal = $("preview-modal"); var iframe = $("preview-frame"); iframe.src = url; modal.classList.add("show"); showStatus("En iOS: usa Compartir → Guardar en Archivos", false); }
      else { showStatus("En iOS: toca Compartir → Guardar en Archivos"); }
    } else {
      a.click();
      showStatus("¡Descargado! (" + sizeKB + " KB)");
    }
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  } catch(err){
    console.error(err);
    showStatus("Error: " + err.message, false);
  } finally {
    showLoading(false);
  }
}

/* ============================================================
   BOTÓN MORADO — 💌 Envíalo
   ============================================================ */
async function sharePersonalized(){
  readInputs();
  showLoading(true, "Preparando tus flores...");
  try {
    var html = await buildGalaxyHTML();
    var nombreArchivo = "flores-amarillas-para-" + slugify(state.name) + ".html";
    var blob = new Blob([html], { type: "text/html;charset=utf-8" });
    var shareText = "🌻 Te hice flores amarillas virtuales 💛\nÁbrelas y descubre la sorpresa ✨";

    try {
      var file = new File([blob], nombreArchivo, { type: "text/html" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: "Flores para " + state.name, text: shareText });
        showLoading(false);
        showStatus("¡Compartido! 🌻");
        return;
      }
    } catch(err) {
      if (err && err.name === "AbortError"){ showLoading(false); return; }
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = nombreArchivo; a.rel = "noopener"; a.style.display = "none";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);

    var waText = shareText + "\n\n📎 Se descargó el archivo " + nombreArchivo + ". Adjúntalo aquí en WhatsApp y envíalo 💌";
    window.open("https://wa.me/?text=" + encodeURIComponent(waText), "_blank");
    showLoading(false);
    showStatus("Archivo listo. Adjúntalo en WhatsApp 📎");
  } catch(err) {
    console.error(err);
    showLoading(false);
    showStatus("Error: " + err.message, false);
  }
}

/* ============================================================
   BOTÓN VERDE — Compartir link del editor
   ============================================================ */
function shareEditorLink(){
  var url = window.location.href.split("#")[0].split("?")[0];
  var texto = "🌻 Estoy creando Flores Amarillas en Dedicatorias Mágicas ✨\nCrea las tuyas gratis:\n" + url;
  window.open("https://wa.me/?text=" + encodeURIComponent(texto), "_blank");
}

function initEditor(){
  $("i-music").addEventListener("change", function(e){
    if (!isPremium){ e.target.value = ""; return; }
    var file = e.target.files[0]; if (!file) return;
    if (file.type.indexOf("audio/") !== 0){ showStatus("Solo archivos de audio", false); return; }
    if (file.size > 6 * 1024 * 1024){ showStatus("Máximo 6 MB de audio", false); return; }
    var rd = new FileReader();
    rd.onload = function(ev){
      state.customMusic = ev.target.result;
      $("m-label").textContent = "✓ " + file.name;
      $("music-drop").classList.add("has-file");
      showStatus("Música cargada ✓");
    };
    rd.readAsDataURL(file);
  });
  $("btn-view").addEventListener("click", visualize);
  $("btn-generate").addEventListener("click", download);
  $("close-preview").addEventListener("click", closePreview);
  ["i-name","i-from","i-date","i-sub"].forEach(function(id){
    $(id).addEventListener("input", readInputs);
  });
  $("i-phrases").addEventListener("input", function(){ enforcePhrasesLimit(); readInputs(); });
  $("share-personalized").addEventListener("click", sharePersonalized);
  $("share-float").addEventListener("click", shareEditorLink);
  renderPalettes();
  initPremium();
  applyPremiumState();
  readInputs();
}

initEditor();
</script>
