<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0218">
<title>Zoom Infinito 🔎✨</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}

  #viewport{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(circle at 50% 50%,#0a0218 0%,#000 100%);
    cursor:zoom-in}

  #world{position:absolute;top:0;left:0;
    width:800px;height:800px;
    transform-origin:0 0;
    will-change:transform}

  .scene{position:absolute;top:0;left:0;
    width:800px;height:800px;overflow:hidden}
  .scene svg{display:block;width:100%;height:100%}

  .hotspot{position:absolute;cursor:zoom-in;z-index:10;
    transition:box-shadow .3s}
  .hotspot::after{content:'';position:absolute;inset:0;
    border:2px dashed rgba(255,255,255,0);
    border-radius:8px;
    transition:border-color .3s, background .3s;
    pointer-events:none}
  .hotspot:hover::after{border-color:rgba(255,200,100,0.9);
    background:rgba(255,200,100,0.08)}
  .hotspot:active::after{border-color:rgba(255,220,140,1);
    background:rgba(255,220,140,0.15)}

  /* Pista visual: lupa pulsante en hotspots */
  .hotspot .lens{position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;
    border:2.5px solid rgba(255,220,140,0.95);
    background:rgba(255,200,80,0.15);
    box-shadow:0 0 20px rgba(255,200,80,0.7),
               inset 0 0 8px rgba(255,220,140,0.4);
    pointer-events:none;
    animation:pulseLens 2s ease-in-out infinite}
  .hotspot .lens::after{content:'';position:absolute;
    bottom:-7px;right:-7px;width:10px;height:2.5px;
    background:rgba(255,220,140,0.95);
    transform:rotate(45deg);transform-origin:left center;
    border-radius:2px;box-shadow:0 0 8px rgba(255,200,80,0.8)}
  @keyframes pulseLens{
    0%,100%{transform:translate(-50%,-50%) scale(1);
      box-shadow:0 0 20px rgba(255,200,80,0.7),
                 inset 0 0 8px rgba(255,220,140,0.4)}
    50%{transform:translate(-50%,-50%) scale(1.15);
      box-shadow:0 0 32px rgba(255,220,140,1),
                 inset 0 0 12px rgba(255,240,180,0.6)}}

  /* ══ UI ══ */
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);
    left:50%;transform:translateX(-50%);
    background:rgba(20,8,45,0.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    padding:9px 18px;border-radius:999px;
    font-size:12px;font-weight:800;letter-spacing:.6px;
    color:#e0d0ff;border:1.5px solid rgba(180,140,255,0.4);
    box-shadow:0 6px 24px rgba(120,60,200,0.4);
    z-index:100;pointer-events:none;
    white-space:nowrap;max-width:90vw;overflow:hidden;
    text-overflow:ellipsis;
    text-transform:uppercase}
  #hud .dot{display:inline-block;width:6px;height:6px;
    border-radius:50%;background:#80ffa0;margin-right:8px;
    box-shadow:0 0 10px #80ffa0;vertical-align:middle}

  #backBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
    left:12px;padding:10px 16px;border-radius:999px;
    background:rgba(20,8,45,0.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1.5px solid rgba(180,140,255,0.4);
    color:#e0d0ff;font-family:inherit;
    font-size:12px;font-weight:800;letter-spacing:.6px;
    cursor:pointer;z-index:100;
    display:flex;align-items:center;gap:7px;
    opacity:0;pointer-events:none;
    transition:opacity .3s,transform .15s}
  #backBtn.show{opacity:1;pointer-events:auto}
  #backBtn:active{transform:scale(.94)}
  #backBtn svg{width:14px;height:14px;
    stroke:currentColor;fill:none;stroke-width:2.5}

  #resetBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);
    right:12px;padding:10px 14px;border-radius:999px;
    background:rgba(20,8,45,0.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1.5px solid rgba(180,140,255,0.4);
    color:#e0d0ff;font-family:inherit;
    font-size:12px;font-weight:800;
    cursor:pointer;z-index:100;
    display:flex;align-items:center;gap:6px;
    transition:transform .15s}
  #resetBtn:active{transform:scale(.94)}
  #resetBtn svg{width:14px;height:14px;
    stroke:currentColor;fill:none;stroke-width:2.5}

  #hint{position:fixed;left:50%;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translateX(-50%);
    padding:11px 22px;border-radius:999px;
    background:rgba(20,8,45,0.82);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    border:1.5px solid rgba(180,140,255,0.4);
    color:#e0d0ff;font-size:12px;font-weight:700;
    letter-spacing:.4px;z-index:100;
    white-space:nowrap;max-width:92vw;overflow:hidden;
    text-overflow:ellipsis;
    box-shadow:0 8px 28px rgba(0,0,0,0.5);
    transition:opacity .7s;pointer-events:none}
  #hint.hide{opacity:0}

  #wm{position:fixed!important;
    bottom:calc(env(safe-area-inset-bottom,0px) + 70px)!important;
    top:auto!important;right:12px!important;left:auto!important;
    padding:9px 15px!important;border-radius:13px!important;
    background:linear-gradient(135deg,
      rgba(255,235,175,.95),rgba(255,200,90,.92),rgba(212,158,50,.95))!important;
    border:2px solid rgba(255,238,180,.95)!important;
    box-shadow:0 8px 26px rgba(180,120,20,.45),
      inset 0 1px 0 rgba(255,255,255,.7)!important;
    font-size:12px!important;line-height:1.3!important;
    font-weight:800!important;text-align:center!important;
    z-index:99999!important;max-width:60vw!important}
  #wm span{display:block!important;font-size:8.5px!important;
    font-weight:700!important;letter-spacing:1.3px!important;
    text-transform:uppercase!important;color:#6b3a05!important}
  #wm a{color:#4a2400!important;text-decoration:none!important;
    font-weight:900!important;font-size:12px!important}

  /* Intro */
  #intro{position:fixed;inset:0;z-index:200;
    background:radial-gradient(circle at 50% 40%,#1a0838 0%,#0a0218 70%,#000 100%);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:18px;padding:32px;text-align:center;
    transition:opacity .7s,visibility .7s}
  #intro.hide{opacity:0;visibility:hidden;pointer-events:none}
  #intro h1{margin:0;font-size:26px;font-weight:900;
    background:linear-gradient(135deg,#ffd4f0,#ff9be0 40%,#c8a0ff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 22px rgba(255,150,220,0.6));
    letter-spacing:.5px}
  #intro p{margin:0;font-size:14.5px;color:#b8a0d8;
    font-weight:600;line-height:1.7;max-width:340px}
  #intro .lens-big{width:70px;height:70px;border-radius:50%;
    border:4px solid rgba(255,220,140,0.9);
    background:radial-gradient(circle at 35% 35%,
      rgba(255,240,180,0.5),rgba(255,180,60,0.2));
    box-shadow:0 0 40px rgba(255,200,80,0.7),
      inset 0 0 20px rgba(255,220,140,0.4);
    position:relative;
    animation:floatLens 3s ease-in-out infinite}
  #intro .lens-big::after{content:'';position:absolute;
    bottom:-14px;right:-14px;width:22px;height:5px;
    background:rgba(255,220,140,0.95);
    transform:rotate(45deg);transform-origin:left center;
    border-radius:3px;box-shadow:0 0 12px rgba(255,200,80,0.9)}
  @keyframes floatLens{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-12px) scale(1.08)}}
  #startBtn{margin-top:8px;padding:16px 42px;
    border:0;cursor:pointer;border-radius:999px;
    font-family:inherit;font-size:16px;font-weight:900;
    color:#fff;letter-spacing:.6px;
    background:linear-gradient(135deg,#c060ff,#8020d0,#5010a0);
    box-shadow:0 16px 44px rgba(140,60,240,0.55),
      inset 0 1px 0 rgba(255,255,255,0.35);
    transition:transform .15s}
  #startBtn:active{transform:scale(.95)}
</style>
</head>

<div id="hud"><span class="dot"></span><span id="hudText">Nivel 1 / 5</span></div>

</button>

<button id="resetBtn">

  Inicio
</button>

<div id="hint">🔎 Toca la lupa para hacer zoom infinito</div>

<div id="wm">

/* ═══════════════ CONSTRUIR EL MUNDO ═══════════════ */
var world = document.getElementById('world');
var viewport = document.getElementById('viewport');
var hudText = document.getElementById('hudText');
var backBtn = document.getElementById('backBtn');
var resetBtn = document.getElementById('resetBtn');
var hint = document.getElementById('hint');

var currentDepth = 0;
var currentTransform = { x: 0, y: 0, scale: 1 };
var hotspotsStack = [];  // hotspots en la ruta actual
var animando = false;

function buildWorld(){
  world.innerHTML = '';
  let parent = world;
  let scenDivs = [];

  for(let i = 0; i < LEVELS.length; i++){
    const level = LEVELS[i];
    const sceneDiv = document.createElement('div');
    sceneDiv.className = 'scene';
    sceneDiv.dataset.level = i;
    sceneDiv.innerHTML = level.svg;
    parent.appendChild(sceneDiv);
    scenDivs.push(sceneDiv);

    if(parent !== world){
      // Escalar la escena para encajar en el hotspot padre
      const pw = parseFloat(parent.style.width) || 100;
      const ph = parseFloat(parent.style.height) || 100;
      const sc = pw / WORLD_SIZE;  // hotspots son cuadrados
      sceneDiv.style.transformOrigin = '0 0';
      sceneDiv.style.transform = 'scale(' + sc + ')';
    }

    if(level.hotspot && i < LEVELS.length - 1){
      const hotspot = document.createElement('div');
      hotspot.className = 'hotspot';
      hotspot.style.left = level.hotspot.x + 'px';
      hotspot.style.top = level.hotspot.y + 'px';
      hotspot.style.width = level.hotspot.w + 'px';
      hotspot.style.height = level.hotspot.h + 'px';
      hotspot.dataset.level = i;
      hotspot.innerHTML = '<div class="lens"></div>';
      hotspot.addEventListener('click', function(e){
        e.stopPropagation();
        if(animando) return;
        focusOn(hotspot, i);
      });
      sceneDiv.appendChild(hotspot);
      parent = hotspot;
    } else {
      break;
    }
  }

  // Ajuste inicial: centrar y ajustar el mundo
  fitWorld(false);
}

function fitWorld(animate){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const padding = 40;
  const scaleX = (vw - padding * 2) / WORLD_SIZE;
  const scaleY = (vh - padding * 2 - 120) / WORLD_SIZE;  // margen inferior por la barra
  const scale = Math.min(scaleX, scaleY);

  const tx = (vw - WORLD_SIZE * scale) / 2;
  const ty = (vh - WORLD_SIZE * scale) / 2 - 20;

  currentTransform = { x: tx, y: ty, scale: scale };
  applyTransform(animate);
  currentDepth = 0;
  hotspotsStack = [];
  updateHUD();
  updateBackBtn();
}

function updateHUD(){
  hudText.textContent = 'Nivel ' + (currentDepth + 1) + ' / ' + LEVELS.length + ' — ' + LEVELS[currentDepth].nombre;
}

function updateBackBtn(){
  if(currentDepth > 0) backBtn.classList.add('show');
  else backBtn.classList.remove('show');
}

/* Calcular posición del hotspot en coordenadas del mundo */
function getHotspotWorldRect(hotspot){
  // Walk up accumulating position and scale
  let chain = [];
  let el = hotspot;
  while(el && el !== world){
    chain.unshift(el);
    el = el.parentElement;
  }

  let cx = 0, cy = 0;
  let cs = 1;

  for(let i = 0; i < chain.length; i++){
    const node = chain[i];
    const style = getComputedStyle(node);

    // Obtener left/top (para hotspots)
    const left = parseFloat(style.left);
    const top = parseFloat(style.top);

    if(!isNaN(left) && !isNaN(top)){
      cx += left * cs;
      cy += top * cs;
    }

    // Obtener el scale del transform del nodo (si es .scene)
    if(node.classList.contains('scene') && i > 0){
      const tf = style.transform;
      if(tf && tf !== 'none'){
        const m = tf.match(/matrix\(([^)]+)\)/);
        if(m){
          const parts = m[1].split(',').map(parseFloat);
          cs *= parts[0];
        }
      }
    }
  }

  // Ahora (cx, cy) es la posición del hotspot en coords del mundo, cs es la escala acumulada
  const hw = parseFloat(getComputedStyle(hotspot).width) * cs;
  const hh = parseFloat(getComputedStyle(hotspot).height) * cs;

  return { x: cx, y: cy, w: hw, h: hh, scale: cs };
}

function focusOn(hotspot, depth){
  const rect = getHotspotWorldRect(hotspot);

  const vw = window.innerWidth;
  const vh = window.innerHeight;

  // Margen para que se vea un poquito del contexto
  const margen = 0.94;
  const sTarget = Math.min(vw / rect.w, vh / rect.h) * margen;

  // Centro del hotspot en coords del mundo
  const hcx = rect.x + rect.w / 2;
  const hcy = rect.y + rect.h / 2;

  // Para que el centro del hotspot quede en el centro del viewport:
  const txTarget = vw / 2 - hcx * sTarget;
  const tyTarget = vh / 2 - hcy * sTarget;

  currentTransform = { x: txTarget, y: tyTarget, scale: sTarget };
  currentDepth = depth + 1;
  hotspotsStack = hotspotsStack.slice(0, depth);
  hotspotsStack[depth] = hotspot;

  animateTo(currentTransform, 900);
  updateHUD();
  updateBackBtn();
  if(hint) hint.classList.add('hide');
}

function goBack(){
  if(currentDepth === 0) return;
  currentDepth--;
  hotspotsStack.pop();
  if(currentDepth === 0){
    fitWorld(true);
  } else {
    // Enfocar el hotspot anterior
    const prev = hotspotsStack[currentDepth - 1];
    if(prev){
      const rect = getHotspotWorldRect(prev);
      const vw = window.innerWidth, vh = window.innerHeight;
      const margen = 0.94;
      const sTarget = Math.min(vw / rect.w, vh / rect.h) * margen;
      const hcx = rect.x + rect.w / 2;
      const hcy = rect.y + rect.h / 2;
      currentTransform = {
        x: vw / 2 - hcx * sTarget,
        y: vh / 2 - hcy * sTarget,
        scale: sTarget
      };
      animateTo(currentTransform, 800);
    } else {
      fitWorld(true);
    }
    updateHUD();
    updateBackBtn();
  }
}

backBtn.addEventListener('click', function(e){
  e.stopPropagation();
  if(!animando) goBack();
});

resetBtn.addEventListener('click', function(e){
  e.stopPropagation();
  if(!animando) fitWorld(true);
});

/* ═══════════════ ANIMACIÓN ═══════════════ */
var animStartTime = 0;
var animStartTransform = null;
var animEndTransform = null;
var animDuration = 0;

function animateTo(target, duration){
  animStartTransform = { ...currentTransform };
  animEndTransform = { ...target };
  animStartTime = performance.now();
  animDuration = duration || 800;
  animando = true;
  requestAnimationFrame(animStep);
}

function easeInOutCubic(t){
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function animStep(now){
  const elapsed = now - animStartTime;
  const t = Math.min(1, elapsed / animDuration);
  const e = easeInOutCubic(t);

  currentTransform.x = animStartTransform.x + (animEndTransform.x - animStartTransform.x) * e;
  currentTransform.y = animStartTransform.y + (animEndTransform.y - animStartTransform.y) * e;
  currentTransform.scale = animStartTransform.scale + (animEndTransform.scale - animStartTransform.scale) * e;

  applyTransform(false);

  if(t < 1){
    requestAnimationFrame(animStep);
  } else {
    animando = false;
  }
}

function applyTransform(){
  world.style.transform = 'translate(' + currentTransform.x + 'px,' + currentTransform.y + 'px) scale(' + currentTransform.scale + ')';
}

/* ═══════════════ INTERACCIÓN TÁCTIL (PAN/ZOOM MANUAL) ═══════════════ */
var panActive = false;
var panStart = { x: 0, y: 0, tx: 0, ty: 0 };
var pinchActive = false;
var pinchStartDist = 0;
var pinchStartScale = 1;
var lastTapTime = 0;

viewport.addEventListener('pointerdown', function(e){
  if(e.target.classList.contains('hotspot') || e.target.closest('.hotspot')) return;
  if(animando) return;
  panActive = true;
  panStart.x = e.clientX;
  panStart.y = e.clientY;
  panStart.tx = currentTransform.x;
  panStart.ty = currentTransform.y;
  viewport.setPointerCapture(e.pointerId);
});

viewport.addEventListener('pointermove', function(e){
  if(!panActive || pinchActive) return;
  const dx = e.clientX - panStart.x;
  const dy = e.clientY - panStart.y;
  currentTransform.x = panStart.tx + dx;
  currentTransform.y = panStart.ty + dy;
  applyTransform();
});

viewport.addEventListener('pointerup', function(e){
  panActive = false;
});

viewport.addEventListener('pointercancel', function(){
  panActive = false;
});

/* Touch para pinch y doble tap */
viewport.addEventListener('touchstart', function(e){
  if(e.touches.length === 2){
    pinchActive = true;
    panActive = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx*dx + dy*dy);
    pinchStartScale = currentTransform.scale;
    // Punto medio para el zoom
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    pinchStart.x = cx;
    pinchStart.y = cy;
    pinchStart.tx = currentTransform.x;
    pinchStart.ty = currentTransform.y;
  } else if(e.touches.length === 1){
    // Detectar doble tap
    const now = Date.now();
    if(now - lastTapTime < 320){
      // Doble tap → reset
      if(!animando) fitWorld(true);
      lastTapTime = 0;
    } else {
      lastTapTime = now;
    }
  }
}, {passive: true});

viewport.addEventListener('touchmove', function(e){
  if(pinchActive && e.touches.length === 2){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const factor = dist / pinchStartDist;
    const newScale = Math.max(0.3, Math.min(20, pinchStartScale * factor));

    // Zoom alrededor del punto medio del pinch
    // Coordenada mundial del punto de pinch al inicio:
    const worldX = (pinchStart.x - pinchStart.tx) / pinchStartScale;
    const worldY = (pinchStart.y - pinchStart.ty) / pinchStartScale;

    // Nueva posición de translate para mantener ese punto en el mismo lugar
    currentTransform.scale = newScale;
    currentTransform.x = pinchStart.x - worldX * newScale;
    currentTransform.y = pinchStart.y - worldY * newScale;

    applyTransform();
  }
}, {passive: true});

viewport.addEventListener('touchend', function(e){
  if(e.touches.length < 2) pinchActive = false;
}, {passive: true});

/* ═══════════════ RESIZE ═══════════════ */
window.addEventListener('resize', function(){
  if(animando) return;
  // Mantener la vista actual pero reajustar si estamos en nivel 0
  if(currentDepth === 0){
    fitWorld(false);
  }
});

/* ═══════════════ INTRO ═══════════════ */
document.getElementById('startBtn').addEventListener('click', function(){
  document.getElementById('intro').classList.add('hide');
  setTimeout(function(){
    var el = document.getElementById('intro');
    if(el) el.style.display = 'none';
  }, 800);
});

/* ═══════════════ INIT ═══════════════ */
buildWorld();

})();
