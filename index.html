<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dedicatorias Mágicas | Regala Emociones Únicas</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #a855f7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo Estrellado / Animado sutil */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.07;
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            font-size: clamp(1.8rem, 4vw, 3rem);
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-muted);
            font-size: clamp(0.9rem, 2vw, 1.1rem);
        }

        /* Barra de Categorías */
        .categories-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .categories-container::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 18px;
            border-radius: 50px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .cat-btn.active, .cat-btn:hover {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        /* Mensaje de aviso dinámico */
        .hint-banner {
            text-align: center;
            margin: 10px auto 25px;
            max-width: 600px;
            padding: 10px 20px;
            background: rgba(168, 85, 247, 0.1);
            border: 1px dashed var(--accent);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #d8b4fe;
        }

        /* Contenedor de Plantillas (Grid) */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .template-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .template-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border-color: rgba(168, 85, 247, 0.3);
        }

        .card-image {
            height: 180px;
            width: 100%;
            object-fit: cover;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 2.5rem;
        }

        .card-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .card-badge.premium {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
        }

        .card-content {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-content h3 {
            font-size: 1.15rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .card-content p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .btn-personalizar {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: var(--primary-gradient);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            text-align: center;
            text-decoration: none;
            display: block;
        }

        .btn-personalizar:hover {
            opacity: 0.9;
        }

        /* Botón Flotante de WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #25d366;
            color: white;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            z-index: 100;
            transition: transform 0.3s;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Dedicatorias Mágicas</h1>
        <p>Sorprende a quienes amas con detalles interactivos e inolvidables</p>
    </header>

    <!-- Filtros de Categorías -->
    <div class="categories-container" id="categoriesContainer">
        <button class="cat-btn active" data-category="todos">Todos</button>
        <button class="cat-btn" data-category="amor">Amor & Aniversarios</button>
        <button class="cat-btn" data-category="cumpleanos">Cumpleaños</button>
        <button class="cat-btn" data-category="amistad">Amistad</button>
        <button class="cat-btn" data-category="agradecimiento">Agradecimiento</button>
    </div>

    <!-- Mensaje de aviso corregido -->
    <div class="hint-banner" id="hintMsg">
        Por favor, haga clic sobre el botón PERSONALIZAR
    </div>

    <!-- Cuadrícula de Plantillas -->
    <main class="grid-container" id="templatesGrid">
        <!-- Las tarjetas se inyectarán dinámicamente mediante JS -->
    </main>

    <!-- Botón flotante WhatsApp -->
    <a href="https://wa.me/521XXXXXXXXXX?text=Hola,%20quiero%20más%20información%20sobre%20las%20Dedicatorias%20Mágicas" class="whatsapp-float" target="_blank" aria-label="WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        // Simulación de plantillas (Puedes externalizar esto en plantillas.js)
        const plantillasData = [
            {
                id: 1,
                title: "Estrellas de Nuestro Amor",
                category: "amor",
                description: "Una dedicatoria romántica con contador de tiempo juntos y galería estelar.",
                badge: "Popular",
                isPremium: false,
                icon: "fa-heart"
            },
            {
                id: 2,
                title: "Pastel Mágico de Cumpleaños",
                category: "cumpleanos",
                description: "Permite soplar velitas virtuales y revelar mensajes ocultos personalizados.",
                badge: "Nuevo",
                isPremium: false,
                icon: "fa-cake-candles"
            },
            {
                id: 3,
                title: "Caja de Recuerdos Dorados",
                category: "amistad",
                description: "Experiencia interactiva estilo álbum fotográfico con música de fondo.",
                badge: "VIP",
                isPremium: true,
                icon: "fa-gem"
            },
            {
                id: 4,
                title: "Carta de Agradecimiento Expresa",
                category: "agradecimiento",
                description: "Mensaje emotivo con diseño minimalista y efectos de confeti al abrir.",
                badge: "Gratis",
                isPremium: false,
                icon: "fa-envelope-open-text"
            },
            {
                id: 5,
                title: "Galaxia de Aniversario",
                category: "amor",
                description: "Diseño avanzado con constelaciones interactivas dedicadas.",
                badge: "VIP",
                isPremium: true,
                icon: "fa-star"
            },
            {
                id: 6,
                title: "Sorpresa de 15 Años / Fiesta",
                category: "cumpleanos",
                description: "Invitación interactiva moderna con cuenta regresiva y confirmación.",
                badge: "Destacado",
                isPremium: false,
                icon: "fa-gift"
            }
        ];

        const grid = document.getElementById('templatesGrid');
        const categoriesContainer = document.getElementById('categoriesContainer');
        const hintMsg = document.getElementById('hintMsg');

        // Función para renderizar plantillas
        function renderPlantillas(filter = 'todos') {
            grid.innerHTML = '';
            
            const filtered = filter === 'todos' 
                ? plantillasData 
                : plantillasData.filter(item => item.category === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align:center; color: var(--text-muted);">No hay plantillas en esta categoría por el momento.</p>`;
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'template-card';
                
                // Validar estado premium en localStorage (ejemplo: 'isUserPremium' = 'true')
                const userIsPremium = localStorage.getItem('isUserPremium') === 'true';
                let badgeHTML = `<div class="card-badge">${item.badge}</div>`;
                
                if (item.isPremium && !userIsPremium) {
                    badgeHTML = `<div class="card-badge premium"><i class="fa-solid fa-lock"></i> VIP</div>`;
                }

                card.innerHTML = `
                    <div class="card-image">
                        <i class="fa-solid ${item.icon}"></i>
                        ${badgeHTML}
                    </div>
                    <div class="card-content">
                        <div>
                            <h3>${item.title}</h3>
                            <p>${item.description}</p>
                        </div>
                        <button class="btn-personalizar" onclick="seleccionarPlantilla(${item.id})">
                            PERSONALIZAR
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Manejo de eventos de categorías
        categoriesContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('cat-btn')) {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                const category = e.target.getAttribute('data-category');
                renderPlantillas(category);
            }
        });

        // Acción al hacer clic en personalizar
        function seleccionarPlantilla(id) {
            const plantilla = plantillasData.find(p => p.id === id);
            const userIsPremium = localStorage.getItem('isUserPremium') === 'true';

            if (plantilla.isPremium && !userIsPremium) {
                alert("Esta plantilla es exclusiva para usuarios VIP. ¡Contáctanos vía WhatsApp para desbloquearla!");
                return;
            }

            // Aquí puedes redirigir a tu editor o pasar el ID por URL
            // Ejemplo: window.location.href = `editor.html?id=${id}`;
            alert(`¡Has seleccionado la plantilla: ${plantilla.title}! Redirigiendo al editor...`);
        }

        // Inicializar renderizado
        renderPlantillas();
    </script>
</body>
</html>
