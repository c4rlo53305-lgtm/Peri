/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════
   Detecta la hora local del dispositivo y elige el momento:
   · Mañana:  5:00  – 10:00  → amanecer suave, rosa/durazno
   · Día:     10:00 – 16:00  → cielo azul brillante, sol alto
   · Tarde:   16:00 – 19:30  → atardecer dorado, naranja
   · Noche:   19:30 – 5:00   → cielo oscuro con estrellas y luna
   ══════════════════════════════════════════════════════════ */
var momentoDia = 'dia';

function detectarMomentoDia(){
  var ahora = new Date();
  var t = ahora.getHours() + ahora.getMinutes()/60;
  if(t >= 5 && t < 10)  return 'manana';
  if(t >= 10 && t < 16) return 'dia';
  if(t >= 16 && t < 19.5) return 'tarde';
  return 'noche';
}

function actualizarMomento(){
  var nuevo = detectarMomentoDia();
  if(nuevo !== momentoDia){
    momentoDia = nuevo;
    buildEstrellas();
  }
  var pal = PALETAS[momentoDia];
  var el = document.getElementById('momentoTexto');
  if(el) el.textContent = pal.etiqueta;
  // Cambiamos el color de fondo del body (para que coincida con el cielo)
  document.body.style.background = pal.coloresCielo[0][1];
  // Tema del indicador
  var m = document.getElementById('momento');
  if(m){
    if(momentoDia === 'noche'){
      m.style.background = 'rgba(30,20,60,.85)';
      m.style.color = '#c8d0ff';
    } else {
      m.style.background = 'rgba(255,255,255,.78)';
      m.style.color = '#7a2a52';
    }
  }
}

/* ══════════════════════════════════════════════════════════
   5) MOTOR
   ══════════════════════════════════════════════════════════ */
var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d', {alpha:false});
var W = 0, H = 0, DPR = 1, T = 0;

var HEAD = {x:0, y:0, r:0, grow:0};
var attached = [];
var flying   = [];
var motes    = [];
var clouds   = [];
var blades   = [];
var sparks   = [];
var hearts   = [];
var estrellas = [];   // estrellas para la noche

var wind = 0, windTarget = 0, windTimer = 0;
var regrow = -1;
var shakeCooldown = 0;

var tiltX = 0, tiltY = 0;
var tiltTargetX = 0, tiltTargetY = 0;
var gyro = {alpha:0, beta:0, gamma:0};
var hasGyro = false;

function rnd(a,b){ return a + Math.random()*(b-a); }
var TAU = Math.PI*2;

/* ---------- construcción ---------- */
function layout(){
  HEAD.r = Math.min(W*0.27, H*0.185, 155);
  HEAD.x = W*0.5;
  HEAD.y = H*0.44;
  HEAD.grow = 1;
}

function buildMotes(){
  motes.length = 0;
  var n = Math.round(Math.min(80, W*H/15000));
  for(var i=0;i<n;i++){
    motes.push({
      x: Math.random()*W, y: Math.random()*H,
      r: rnd(0.8, 2.8),
      a: rnd(0.15, 0.6),
      vx: rnd(-0.12, 0.12),
      vy: rnd(-0.22, -0.04),
      ph: Math.random()*TAU,
      pink: Math.random() < 0.35
    });
  }
}

function buildClouds(){
  clouds.length = 0;
  for(var i=0;i<5;i++){
    clouds.push({
      x: Math.random()*W,
      y: rnd(H*0.05, H*0.42),
      r: rnd(W*0.10, W*0.22),
      sp: rnd(0.06, 0.22),
      a: rnd(0.25, 0.6),
      pink: Math.random() < 0.4
    });
  }
}

function buildGrass(){
  blades.length = 0;
  var n = Math.round(Math.min(160, W/3.2));
  for(var i=0;i<n;i++){
    var front = Math.random() < 0.45;
    blades.push({
      x: Math.random()*W,
      h: front ? rnd(28, 78) : rnd(14, 46),
      w: front ? rnd(1.6, 3.2) : rnd(1, 2.2),
      ph: Math.random()*TAU,
      amp: rnd(4, 16),
      front: front,
      hueOffset: rnd(-12, 12)
    });
  }
}

function buildEstrellas(){
  estrellas.length = 0;
  // Solo se ven de noche, pero las generamos siempre
  var n = Math.round(Math.min(140, W*H/8000));
  for(var i=0;i<n;i++){
    estrellas.push({
      x: Math.random()*W,
      y: Math.random()*H*0.8,
      r: rnd(0.5, 2.0),
      aBase: rnd(0.3, 1),
      ph: Math.random()*TAU,
      tw: rnd(0.4, 1.8)
    });
  }
}

function buildHead(){
  attached.length = 0;
  var N = 165;
  for(var i=0;i<N;i++){
    var a = Math.random()*TAU;
    var t = Math.pow(Math.random(), 0.55);
    attached.push({
      a: a,
      len: HEAD.r * (0.52 + 0.48*t),
      ph: Math.random()*TAU,
      sz: rnd(0.65, 1.25)
    });
  }
  HEAD.grow = 0;
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildMotes();
  buildClouds();
  buildGrass();
  buildEstrellas();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 250); });

function tipOf(s){
  var sway = Math.sin(T*0.9)*0.02 + wind*0.9 + tiltX*0.06;
  var ang = s.a + sway + Math.sin(T*1.3 + s.ph)*0.03;
  var len = s.len * HEAD.grow;
  return {x: HEAD.x + Math.cos(ang)*len, y: HEAD.y + Math.sin(ang)*len, ang: ang};
}

function releaseSeeds(n, dirx, diry, power){
  n = Math.min(n, attached.length);
  var released = 0;
  for(var i=0;i<n;i++){
    var idx = (Math.random()*attached.length) | 0;
    var s = attached.splice(idx, 1)[0];
    if(!s) break;
    var t = tipOf(s);
    var ox = t.x - HEAD.x, oy = t.y - HEAD.y;
    var d = Math.sqrt(ox*ox + oy*oy) || 1;

    var sp = 1.0 + Math.random()*1.8 + power*4.2;
    flying.push({
      x: t.x, y: t.y,
      vx: (ox/d)*sp + dirx*power*4.5 + rnd(-0.5,0.5),
      vy: (oy/d)*sp + diry*power*4.5 + rnd(-0.5,0.5) - 0.5,
      rot: Math.atan2(oy, ox),
      len: rnd(11, 20),
      sz: rnd(0.7, 1.25),
      ph: Math.random()*TAU,
      alpha: 1,
      life: 0,
      heart: Math.random() < 0.22
    });

    if(Math.random() < 0.4){
      sparks.push({x:t.x, y:t.y, r: rnd(1.2,3), a: 0.85, pink: Math.random()<0.6});
    }
    released++;
  }
  return released;
}

function spawnHeart(x, y, power){
  hearts.push({
    x: x, y: y,
    vx: rnd(-1.2,1.2)*power,
    vy: -rnd(0.8, 2.2)*power,
    size: rnd(10, 22),
    rot: rnd(-0.4, 0.4),
    vrot: rnd(-0.03, 0.03),
    life: 0,
    maxLife: rnd(1.8, 3.2),
    hue: rnd(330, 355),
    alpha: 1
  });
}

/* ══════════════════════════════════════════════════════════
   6) SENSORES (solo movimiento, sin sonido)
   ══════════════════════════════════════════════════════════ */
var lastAcc = {x:0,y:0,z:0}, hasLast = false;
function onMotion(e){
  var a = e.accelerationIncludingGravity || e.acceleration;
  if(!a || a.x === null || a.x === undefined) return;

  if(a.x !== undefined && a.y !== undefined){
    tiltTargetX = Math.max(-1, Math.min(1, a.x/9.8));
    tiltTargetY = Math.max(-1, Math.min(1, a.y/9.8));
  }

  if(!hasLast){
    lastAcc = {x:a.x, y:a.y, z:a.z};
    hasLast = true;
    return;
  }
  var d = Math.abs(a.x-lastAcc.x) + Math.abs(a.y-lastAcc.y) + Math.abs(a.z-lastAcc.z);
  lastAcc = {x:a.x, y:a.y, z:a.z};

  if(d > 11 && shakeCooldown <= 0){
    var power = Math.min(d/65, 1);
    var rel = releaseSeeds(Math.round(6 + power*28), rnd(-0.5,0.5) + wind, -0.18, power);
    if(rel > 0){
      windTarget = 0.5 + power*1.0;
      shakeCooldown = 0.08;
      sumarDeseo(rel);
      if(Math.random() < 0.55) mostrarFrase();
      for(var i=0;i<Math.round(2+power*4);i++){
        spawnHeart(HEAD.x + rnd(-HEAD.r,HEAD.r), HEAD.y + rnd(-HEAD.r*0.3,HEAD.r*0.5), 0.8+power);
      }
      if(navigator.vibrate) navigator.vibrate(Math.round(10 + power*25));
      ocultarHint();
    }
  }
}

function onOrientation(e){
  if(e.beta !== null && e.gamma !== null){
    hasGyro = true;
    gyro.alpha = e.alpha || 0;
    gyro.beta  = e.beta  || 0;
    gyro.gamma = e.gamma || 0;
    var tx = Math.max(-1, Math.min(1, gyro.gamma/45));
    var ty = Math.max(-1, Math.min(1, gyro.beta/60));
    tiltTargetX = tx;
    tiltTargetY = ty;
  }
}

function pedirPermisos(){
  var needsPerm = typeof DeviceMotionEvent !== 'undefined' &&
                  typeof DeviceMotionEvent.requestPermission === 'function';
  if(needsPerm){
    DeviceMotionEvent.requestPermission().then(function(r){
      if(r === 'granted') window.addEventListener('devicemotion', onMotion, {passive:true});
    }).catch(function(){});
    if(typeof DeviceOrientationEvent !== 'undefined' &&
       typeof DeviceOrientationEvent.requestPermission === 'function'){
      DeviceOrientationEvent.requestPermission().then(function(r){
        if(r === 'granted') window.addEventListener('deviceorientation', onOrientation, {passive:true});
      }).catch(function(){});
    }
  }else{
    window.addEventListener('devicemotion', onMotion, {passive:true});
    window.addEventListener('deviceorientation', onOrientation, {passive:true});
  }
}
window.addEventListener('devicemotion', onMotion, {passive:true});
window.addEventListener('deviceorientation', onOrientation, {passive:true});

/* ══════════════════════════════════════════════════════════
   7) INTERACCIÓN (sin sonido)
   ══════════════════════════════════════════════════════════ */
var pressing = false, lastPX = 0, lastPY = 0;

function ocultarHint(){
  var h = document.getElementById('hint');
  if(h) h.classList.add('hide');
}

function blowFrom(px, py, power){
  var dx = px - HEAD.x, dy = py - HEAD.y;
  var d = Math.sqrt(dx*dx + dy*dy) || 1;
  var rel = releaseSeeds(Math.round(3 + power*14), (dx/d)*0.5, (dy/d)*0.5 - 0.2, power);
  if(rel > 0){
    windTarget = 0.35 + power*0.8;
    sumarDeseo(rel);
    if(Math.random() < 0.7) spawnHeart(px + rnd(-20,20), py + rnd(-20,20), 0.6);
  }
}

canvas.addEventListener('pointerdown', function(e){
  pedirPermisos();
  ocultarHint();
  pressing = true;
  lastPX = e.clientX; lastPY = e.clientY;
  blowFrom(e.clientX, e.clientY, 0.55);
  if(Math.random() < 0.5) mostrarFrase();
}, {passive:true});

canvas.addEventListener('pointermove', function(e){
  if(!pressing) return;
  var dx = e.clientX - lastPX, dy = e.clientY - lastPY;
  var dist = Math.sqrt(dx*dx + dy*dy);
  if(dist > 26){
    lastPX = e.clientX; lastPY = e.clientY;
    blowFrom(e.clientX, e.clientY, Math.min(dist/70, 1));
  }
}, {passive:true});

window.addEventListener('pointerup', function(){ pressing = false; }, {passive:true});
window.addEventListener('pointercancel', function(){ pressing = false; }, {passive:true});

var lastTap = 0;
canvas.addEventListener('pointerup', function(e){
  var now = Date.now();
  if(now - lastTap < 300){
    for(var i=0;i<14;i++){
      spawnHeart(
        HEAD.x + rnd(-HEAD.r*1.6, HEAD.r*1.6),
        HEAD.y + rnd(-HEAD.r*1.4, HEAD.r*1.2),
        1.2
      );
    }
    mostrarFrase();
  }
  lastTap = now;
}, {passive:true});

/* ══════════════════════════════════════════════════════════
   8) ACTUALIZACIÓN
   ══════════════════════════════════════════════════════════ */
var tiempoUltimoChequeo = 0;
function update(dt){
  var k = dt * 60;
  T += dt;

  // Comprobamos el momento del día cada 30 segundos
  tiempoUltimoChequeo += dt;
  if(tiempoUltimoChequeo > 30){
    tiempoUltimoChequeo = 0;
    actualizarMomento();
  }

  tiltX += (tiltTargetX - tiltX) * 0.06 * k;
  tiltY += (tiltTargetY - tiltY) * 0.06 * k;

  windTimer -= dt;
  if(windTimer <= 0){
    windTarget = rnd(-0.45, 0.85) + tiltX*0.4;
    windTimer = rnd(2.5, 6.5);
  }
  wind += (windTarget - wind) * 0.012 * k;

  if(HEAD.grow < 1) HEAD.grow = Math.min(1, HEAD.grow + dt*0.85);

  HEAD.x = W*0.5 + Math.sin(T*0.7) * W * 0.012 + tiltX * W * 0.06;
  HEAD.y = H*0.44 + tiltY * H * 0.02;

  if(attached.length > 0 && Math.random() < 0.006*k){
    releaseSeeds(1, wind*0.6, -0.05, 0.15);
  }

  if(shakeCooldown > 0) shakeCooldown -= dt;

  for(var i=flying.length-1;i>=0;i--){
    var p = flying[i];
    var drift = wind * 1.7 + tiltX * 0.6;
    p.vx += (drift - p.vx) * 0.014 * k;
    p.vy += (0.30 - p.vy) * 0.012 * k;
    p.vx += Math.sin(T*1.5 + p.ph) * 0.03 * k;
    p.x += p.vx * k;
    p.y += p.vy * k;

    var target = -Math.PI/2 + Math.sin(T*1.1 + p.ph)*0.4 + wind*1.3;
    var diff = ((target - p.rot + Math.PI*3) % TAU) - Math.PI;
    p.rot += diff * 0.022 * k;

    p.life += dt;
    if(p.x < -90 || p.x > W+90 || p.y > H+90 || p.y < -140){
      p.alpha -= 0.03 * k;
    }else if(p.life > 9){
      p.alpha -= 0.007 * k;
    }
    if(p.alpha <= 0) flying.splice(i,1);
  }

  for(var hi=hearts.length-1;hi>=0;hi--){
    var hh = hearts[hi];
    hh.vy += 0.012 * k;
    hh.vx += Math.sin(T*1.8 + hh.rot*4) * 0.02 * k;
    hh.x += hh.vx * k;
    hh.y += hh.vy * k;
    hh.rot += hh.vrot * k;
    hh.life += dt;
    var lifeRatio = hh.life / hh.maxLife;
    if(lifeRatio > 0.7){
      hh.alpha = Math.max(0, 1 - (lifeRatio - 0.7)/0.3);
    }
    if(hh.alpha <= 0 || hh.life > hh.maxLife) hearts.splice(hi,1);
  }

  for(var m=0;m<motes.length;m++){
    var mo = motes[m];
    mo.x += (mo.vx + wind*0.5) * k;
    mo.y += mo.vy * k;
    mo.ph += 0.02 * k;
    if(mo.x > W+20) mo.x = -20;
    if(mo.x < -20)  mo.x = W+20;
    if(mo.y < -20)  mo.y = H+20;
    if(mo.y > H+20) mo.y = -20;
  }

  for(var s=sparks.length-1;s>=0;s--){
    sparks[s].a -= 0.022 * k;
    sparks[s].r += 0.05 * k;
    if(sparks[s].a <= 0) sparks.splice(s,1);
  }

  for(var c=0;c<clouds.length;c++){
    var cl = clouds[c];
    cl.x += (cl.sp + wind*0.7) * k * 0.5;
    if(cl.x - cl.r*2 > W) cl.x = -cl.r*2;
    if(cl.x + cl.r*2 < 0) cl.x = W + cl.r*2;
  }

  // Estrellas (solo se animan de noche)
  for(var e=0;e<estrellas.length;e++){
    estrellas[e].ph += 0.02 * k;
  }

  if(attached.length === 0 && flying.length < 45){
    if(regrow < 0) regrow = 2.2;
    regrow -= dt;
    if(regrow <= 0){ buildHead(); regrow = -1; }
  }
}

/* ══════════════════════════════════════════════════════════
   9) DIBUJO
   ══════════════════════════════════════════════════════════ */
function drawSky(){
  var pal = PALETAS[momentoDia];

  // Cielo con gradiente según la paleta
  var sky = ctx.createLinearGradient(0,0,0,H);
  for(var i=0;i<pal.coloresCielo.length;i++){
    var p = pal.coloresCielo[i];
    sky.addColorStop(p[0], p[1]);
  }
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,H);

  // Estrellas (solo de noche, con opacidad progresiva)
  if(momentoDia === 'noche'){
    for(var e=0;e<estrellas.length;e++){
      var es = estrellas[e];
      var tw = 0.5 + 0.5*Math.sin(es.ph * es.tw);
      ctx.globalAlpha = es.aBase * (0.4 + tw*0.6);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(es.x - tiltX*8, es.y - tiltY*5, es.r, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // Cuerpo celeste: sol o luna
  var solX = W*(pal.solX - tiltX*0.04);
  var solY = H*(pal.solY + tiltY*0.02);
  var solR = W*0.62;
  var sc = pal.solColor;
  var sol = ctx.createRadialGradient(solX, solY, 0, solX, solY, solR);
  sol.addColorStop(0,    'rgba(' + sc[0] + ',' + sc[1] + ',' + sc[2] + ',' + pal.solHalo + ')');
  sol.addColorStop(0.14, 'rgba(' + sc[0] + ',' + sc[1] + ',' + sc[2] + ',' + (pal.solHalo*0.6) + ')');
  sol.addColorStop(0.48, 'rgba(' + sc[0] + ',' + sc[1] + ',' + sc[2] + ',' + (pal.solHalo*0.14) + ')');
  sol.addColorStop(1,    'rgba(' + sc[0] + ',' + sc[1] + ',' + sc[2] + ',0)');
  ctx.fillStyle = sol;
  ctx.fillRect(0,0,W,H);

  // Si es luna, dibujamos un disco brillante
  if(pal.solTipo === 'luna'){
    var discoR = Math.min(W, H) * 0.09;
    var disco = ctx.createRadialGradient(solX, solY, 0, solX, solY, discoR);
    disco.addColorStop(0,    'rgba(240, 245, 255, 0.95)');
    disco.addColorStop(0.7,  'rgba(220, 230, 255, 0.75)');
    disco.addColorStop(1,    'rgba(200, 220, 255, 0)');
    ctx.fillStyle = disco;
    ctx.beginPath();
    ctx.arc(solX, solY, discoR, 0, TAU);
    ctx.fill();

    // Cráteres sutiles de la luna
    ctx.save();
    ctx.globalAlpha = 0.15;
    ctx.fillStyle = '#90a0c0';
    ctx.beginPath(); ctx.arc(solX - discoR*0.25, solY - discoR*0.15, discoR*0.18, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(solX + discoR*0.2,  solY + discoR*0.25, discoR*0.14, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(solX + discoR*0.05, solY - discoR*0.35, discoR*0.10, 0, TAU); ctx.fill();
    ctx.restore();
  }
}

function drawClouds(){
  var pal = PALETAS[momentoDia];
  for(var i=0;i<clouds.length;i++){
    var c = clouds[i];
    ctx.save();
    // Nubes más transparentes de noche
    var alphaNube = c.a * (momentoDia === 'noche' ? 0.5 : 1);
    ctx.globalAlpha = alphaNube;
    ctx.fillStyle = c.pink ? (momentoDia === 'noche' ? '#3a2860' : '#ffe4ee') : pal.nubeColor;
    var cx = c.x - tiltX * 30;
    var cy = c.y - tiltY * 14;
    ctx.beginPath();
    ctx.ellipse(cx, cy, c.r, c.r*0.40, 0, 0, TAU);
    ctx.ellipse(cx - c.r*0.58, cy + c.r*0.10, c.r*0.58, c.r*0.28, 0, 0, TAU);
    ctx.ellipse(cx + c.r*0.62, cy + c.r*0.12, c.r*0.62, c.r*0.30, 0, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawGround(){
  var pal = PALETAS[momentoDia];
  var g = ctx.createLinearGradient(0, H*0.80, 0, H);
  g.addColorStop(0, pal.sueloTop);
  g.addColorStop(0.45, pal.sueloMed);
  g.addColorStop(1, pal.sueloBot);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0, H*0.90);
  ctx.quadraticCurveTo(W*0.5, H*0.845, W, H*0.90);
  ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fill();
}

function drawGrass(front){
  var pal = PALETAS[momentoDia];
  var groundY = H*0.925;
  ctx.lineCap = 'round';
  for(var i=0;i<blades.length;i++){
    var b = blades[i];
    if(b.front !== front) continue;
    var sw = Math.sin(T*1.4 + b.ph) * b.amp + wind * 15 * (front?1.3:0.8) + tiltX*6;
    var hue = pal.pastoH + b.hueOffset;
    var lum = front ? pal.pastoFrontL : pal.pastoBackL;
    ctx.beginPath();
    ctx.moveTo(b.x, groundY);
    ctx.quadraticCurveTo(b.x + sw*0.5, groundY - b.h*0.6, b.x + sw, groundY - b.h);
    ctx.strokeStyle = 'hsla(' + hue + ',' + pal.pastoS + '%,' + lum + '%,' + (front?0.62:0.36) + ')';
    ctx.lineWidth = b.w;
    ctx.stroke();
  }
}

function drawMotes(){
  var pal = PALETAS[momentoDia];
  for(var i=0;i<motes.length;i++){
    var m = motes[i];
    ctx.globalAlpha = m.a * (0.55 + 0.45*Math.sin(m.ph));
    ctx.fillStyle = m.pink ? pal.motasPink : pal.motas;
    ctx.beginPath();
    ctx.arc(m.x - tiltX*10, m.y - tiltY*6, m.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawStem(){
  var pal = PALETAS[momentoDia];
  var baseX = W*0.5 + Math.sin(T*0.7) * W * 0.008;
  var baseY = H*0.925;
  var topY  = HEAD.y + HEAD.r * 0.62 * HEAD.grow;
  var midX  = (baseX + HEAD.x)/2 + Math.sin(T*0.7)*4;

  // Tallo principal: color cambia según momento
  var talloColor;
  if(momentoDia === 'noche'){
    talloColor = 'rgba(80,110,90,0.85)';
  } else if(momentoDia === 'tarde'){
    talloColor = 'rgba(120,140,80,0.9)';
  } else if(momentoDia === 'manana'){
    talloColor = 'rgba(110,150,90,0.9)';
  } else {
    talloColor = 'rgba(96,152,84,0.92)';
  }

  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(midX, (baseY + topY)/2, HEAD.x, topY);
  ctx.strokeStyle = talloColor;
  ctx.lineWidth = 3.2;
  ctx.lineCap = 'round';
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(baseX, baseY);
  ctx.quadraticCurveTo(midX, (baseY + topY)/2, HEAD.x, topY);
  ctx.strokeStyle = momentoDia === 'noche' ? 'rgba(140,180,160,0.35)' : 'rgba(180,220,150,0.35)';
  ctx.lineWidth = 1.1;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(HEAD.x, HEAD.y + HEAD.r*0.60*HEAD.grow, HEAD.r*0.10, HEAD.r*0.07, 0, 0, TAU);
  ctx.fillStyle = momentoDia === 'noche' ? 'rgba(100,130,110,0.9)' : 'rgba(130,158,96,0.9)';
  ctx.fill();
}

function drawHead(){
  if(attached.length === 0) return;
  var pal = PALETAS[momentoDia];
  var g = HEAD.grow;
  var cx = HEAD.x, cy = HEAD.y;
  var sway = Math.sin(T*0.9)*0.02 + wind*0.9 + tiltX*0.06;

  // Halo del diente: tinte según el momento
  var halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, HEAD.r*1.85);
  halo.addColorStop(0,   pal.haloTinte);
  halo.addColorStop(0.42,'rgba(255,255,255,0.16)');
  halo.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = halo;
  ctx.beginPath();
  ctx.arc(cx, cy, HEAD.r*1.85, 0, TAU);
  ctx.fill();

  // Vilanos: color más frío de noche
  var vilanoColor = momentoDia === 'noche'
    ? 'rgba(200,220,255,0.72)'
    : 'rgba(255,255,255,0.88)';

  var tips = new Float32Array(attached.length * 4);
  ctx.beginPath();
  for(var i=0;i<attached.length;i++){
    var s = attached[i];
    var ang = s.a + sway + Math.sin(T*1.3 + s.ph)*0.03;
    var len = s.len * g;
    var tx = cx + Math.cos(ang)*len;
    var ty = cy + Math.sin(ang)*len;
    tips[i*4]   = tx;
    tips[i*4+1] = ty;
    tips[i*4+2] = ang;
    tips[i*4+3] = s.sz;
    ctx.moveTo(cx, cy);
    ctx.lineTo(tx, ty);
  }
  ctx.strokeStyle = momentoDia === 'noche' ? 'rgba(200,220,255,0.38)' : 'rgba(255,255,255,0.48)';
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.beginPath();
  for(var j=0;j<tips.length;j+=4){
    var px = tips[j], py = tips[j+1], pa = tips[j+2], ps = tips[j+3];
    for(var h=0;h<7;h++){
      var off = (h/6 - 0.5) * 1.28;
      var ha = pa + off;
      var hl = 13 * ps * g;
      ctx.moveTo(px, py);
      ctx.lineTo(px + Math.cos(ha)*hl, py + Math.sin(ha)*hl);
    }
  }
  ctx.strokeStyle = vilanoColor;
  ctx.lineWidth = 0.7;
  ctx.stroke();
}

function dibujarCorazon(cx, cy, size, rot, alpha, hue){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rot);
  ctx.globalAlpha = alpha;
  ctx.scale(size/20, size/20);

  var grad = ctx.createRadialGradient(0,0,0, 0,0, 18);
  grad.addColorStop(0, 'hsla(' + hue + ',100%,78%,1)');
  grad.addColorStop(0.6, 'hsla(' + hue + ',90%,62%,1)');
  grad.addColorStop(1, 'hsla(' + hue + ',85%,48%,1)');
  ctx.fillStyle = grad;
  ctx.shadowColor = 'hsla(' + hue + ',90%,60%,0.6)';
  ctx.shadowBlur = 12;

  ctx.beginPath();
  ctx.moveTo(0, 6);
  ctx.bezierCurveTo(-12, -4, -14, -14, -7, -14);
  ctx.bezierCurveTo(-2, -14, 0, -10, 0, -8);
  ctx.bezierCurveTo(0, -10, 2, -14, 7, -14);
  ctx.bezierCurveTo(14, -14, 12, -4, 0, 6);
  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = alpha*0.6;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.beginPath();
  ctx.ellipse(-4, -8, 2.5, 4, -0.5, 0, TAU);
  ctx.fill();

  ctx.restore();
}

function drawFlying(){
  var semillaColor = momentoDia === 'noche'
    ? 'rgba(210,225,255,0.80)'
    : 'rgba(255,255,255,0.80)';

  for(var i=0;i<flying.length;i++){
    var p = flying[i];
    if(p.heart){
      dibujarCorazon(p.x, p.y, 12, p.rot, p.alpha*0.92, 340);
      continue;
    }
    var a = p.rot;
    ctx.globalAlpha = Math.max(p.alpha, 0);

    ctx.beginPath();
    ctx.moveTo(p.x - Math.cos(a)*p.len*0.32, p.y - Math.sin(a)*p.len*0.32);
    ctx.lineTo(p.x, p.y);
    ctx.strokeStyle = momentoDia === 'noche' ? 'rgba(200,220,255,0.45)' : 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.beginPath();
    for(var h=0;h<9;h++){
      var off = (h/8 - 0.5) * 1.55;
      var ha = a + off;
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x + Math.cos(ha)*p.len*0.92, p.y + Math.sin(ha)*p.len*0.92);
    }
    ctx.strokeStyle = semillaColor;
    ctx.lineWidth = 0.7;
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawHearts(){
  for(var i=0;i<hearts.length;i++){
    var h = hearts[i];
    dibujarCorazon(h.x, h.y, h.size, h.rot, h.alpha*0.9, h.hue);
  }
}

function drawSparks(){
  for(var i=0;i<sparks.length;i++){
    var s = sparks[i];
    var col = s.pink ? '255,180,215' : (momentoDia === 'noche' ? '220,230,255' : '255,255,230');
    var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r*4);
    g.addColorStop(0, 'rgba(' + col + ',' + s.a + ')');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r*4, 0, TAU);
    ctx.fill();
  }
}

function drawTinte(){
  var pal = PALETAS[momentoDia];
  ctx.fillStyle = pal.tinte;
  ctx.fillRect(0, 0, W, H);
}

function draw(){
  drawSky();
  drawClouds();
  drawMotes();
  drawGround();
  drawGrass(false);
  drawStem();
  drawHead();
  drawSparks();
  drawFlying();
  drawHearts();
  drawGrass(true);
  drawTinte();
}

/* ══════════════════════════════════════════════════════════
   10) BUCLE
   ══════════════════════════════════════════════════════════ */
var lastT = 0;
function loop(now){
  if(!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.05) dt = 0.05;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ══════════════════════════════════════════════════════════
   11) ARRANQUE
   ══════════════════════════════════════════════════════════ */
resize();
buildHead();
HEAD.grow = 0;

// Detectamos el momento del día al inicio
actualizarMomento();
// Y lo comprobamos cada 60 segundos (por si el usuario deja la página abierta)
setInterval(actualizarMomento, 60000);

requestAnimationFrame(loop);

setTimeout(ocultarHint, 7000);

})();
</script>
